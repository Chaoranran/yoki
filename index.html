<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>又记 - 记录</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <link rel="stylesheet" href="styles/theme.css">
    <style>
        .watch-item { display: flex; flex-direction: column; cursor: pointer; }
        .progress-area { order: 0; }

        .float-btn {
            position: fixed;
            right: 1.5rem;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background-color: var(--c-card);
            border: 1px solid var(--c-border);
            color: var(--c-text-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 40;
            transition: all 0.2s;
        }
        .float-btn:hover {
            background-color: var(--c-accent);
            color: #fff;
            border-color: var(--c-accent);
        }
        .float-btn-top { bottom: 6rem; }
        .float-btn-bottom { bottom: 2.5rem; }
        .float-btn svg {
            width: 14px;
            height: 14px;
            opacity: 0.7;
        }
        .float-btn:hover svg {
            opacity: 1;
            color: #fff;
        }
        .record-card {
            cursor: context-menu;
        }
        .record-card .card-note-btns {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .record-card:hover .card-note-btns {
            opacity: 1;
        }
        .record-card-horizontal {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--c-border, #e5e7eb);
            cursor: context-menu;
            transition: background-color 0.15s;
            gap: 1rem;
            min-width: 0;
        }
        .record-card-horizontal:hover {
            background-color: var(--c-gray-100, #f3f4f6);
        }
        .record-card-horizontal .card-note-btns {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .record-card-horizontal:hover .card-note-btns {
            opacity: 1;
        }
        .record-card-horizontal .watch-date-line {
            font-size: 0.75rem;
            color: var(--c-text-soft, #9ca3af);
        }
        /* 下划线式选项卡 */
        .tab-underline {
            position: relative;
            color: #9ca3af;
            cursor: pointer;
            transition: color 0.15s;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.25rem 0;
            background: none;
            border: none;
        }
        .tab-underline:hover { color: #6b7280; }
        .tab-underline.active {
            color: var(--c-accent, #6366f1);
        }
        .tab-underline.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--c-accent, #6366f1);
            border-radius: 1px;
        }
        /* 操作按钮 */
        .action-btn {
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            background: transparent;
            color: #9ca3af;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .action-btn:hover {
            color: #6b7280;
            border-color: #d1d5db;
        }
        #hoverPreview {
            display: none;
            position: fixed;
            z-index: 9999;
            background: var(--c-card, #fff);
            border: 1px solid var(--c-border, #e5e7eb);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
            overflow-x: hidden;
            word-break: break-word;
            overscroll-behavior: contain;
            padding: 12px 16px;
            font-size: 0.875rem;
            line-height: 1.6;
            color: var(--c-text, #1f2937);
        }
        #hoverPreview h1, #hoverPreview h2, #hoverPreview h3 {
            font-weight: 700;
            margin: 0.5em 0 0.3em;
        }
        #hoverPreview h1 { font-size: 1.25em; }
        #hoverPreview h2 { font-size: 1.1em; }
        #hoverPreview h3 { font-size: 1em; }
        #hoverPreview p { margin: 0.4em 0; }
        #hoverPreview blockquote {
            border-left: 3px solid var(--c-accent, #6366f1);
            padding-left: 0.8em;
            margin: 0.5em 0;
            color: var(--c-text-soft, #6b7280);
        }
        #hoverPreview ul, #hoverPreview ol {
            padding-left: 1.5em;
            margin: 0.3em 0;
        }
        #hoverPreview code {
            background: var(--c-gray-100, #f3f4f6);
            padding: 0.1em 0.3em;
            border-radius: 3px;
            font-size: 0.85em;
        }
        #hoverPreview .truncation-hint {
            color: var(--c-text-soft, #9ca3af);
            font-size: 0.75rem;
            margin-top: 0.5em;
        }
    </style>
    <script src="common.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/icons.js"></script>
    <script src="db.js"></script>
    <script src="notes-common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" async></script>
</head>
<body class="min-h-screen">
    <div class="flex">
        <div id="sidebar-container"></div>

        <div class="flex-1 ml-16 p-4 sm:p-8 min-w-0">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mb-4">
                    <button class="tab-underline active" data-type="all">全部</button>
                    <button class="tab-underline" data-type="book">书籍</button>
                    <button class="tab-underline" data-type="movie">电影</button>
                    <button class="tab-underline" data-type="anime">动漫</button>
                    <button class="tab-underline" data-type="series">剧集</button>
                    <button class="tab-underline" data-type="variety">综艺</button>
                    <span class="flex-1"></span>
                    <button id="batchToggleBtn" class="action-btn">批量操作</button>
                    <button id="sortOrderBtn" class="action-btn">降序</button>
                    <button id="viewToggleBtn" class="action-btn" title="切换视图">
                        <span id="viewToggleIcon"><svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg></span>
                    </button>
                    <button id="exportMdBtn" class="action-btn" title="导出为 Markdown 表格">MD</button>
                </div>
                <div class="mb-6">
                    <input type="text" id="searchBox" placeholder="根据作品名称搜索..." class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 outline-none">
                </div>
                <!-- 状态筛选栏 -->
                <div id="statusFilterBar" class="mb-4">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-sm text-gray-500 font-medium">状态：</span>
                        <button class="status-btn px-3 py-1 rounded-full text-sm transition bg-indigo-600 text-white" data-status="">全部</button>
                        <button class="status-btn px-3 py-1 rounded-full text-sm transition bg-gray-200 text-gray-700" data-status="想看">想看</button>
                        <button class="status-btn px-3 py-1 rounded-full text-sm transition bg-gray-200 text-gray-700" data-status="已看">已看</button>
                        <button class="status-btn px-3 py-1 rounded-full text-sm transition bg-gray-200 text-gray-700" data-status="在看">在看</button>
                        <span class="mx-2 text-gray-300">|</span>
                        <button id="toggleTagCloudBtn" class="text-sm text-gray-500 hover:text-gray-700">标签筛选</button>
                    </div>
                </div>
                <div id="tagCloud" class="mb-6 hidden"></div>
                <div id="batchToolbar" class="mb-4 hidden flex flex-wrap items-center gap-2">
                    <button id="batchDeleteBtn" class="px-4 py-2 bg-red-600 text-white rounded-md text-sm hover:bg-red-700">批量删除所选</button>
                    <div class="flex items-center gap-2">
                        <input type="text" id="batchTagInput" placeholder="新标签（逗号分隔）" class="border border-gray-300 rounded-md p-2 text-sm outline-none">
                        <button id="batchTagBtn" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700">批量改标签</button>
                    </div>
                </div>
                <div id="recordCount" class="mb-2 text-xs text-gray-300"></div>
                <div id="recordsDisplay" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4"></div>
                <div id="skeletonGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 hidden">
                    ${Array(6).fill(`<div class="bg-white dark:bg-[#262932] rounded-lg shadow-md border border-gray-200 dark:border-gray-600 overflow-hidden">
                        <div class="w-full h-56 bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
                        <div class="p-4 space-y-3">
                            <div class="h-5 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-3/4"></div>
                            <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-1/4"></div>
                            <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-1/2"></div>
                            <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded animate-pulse w-2/3"></div>
                            <div class="flex gap-2 mt-3">
                                <div class="h-6 bg-gray-200 dark:bg-gray-700 rounded-full animate-pulse w-12"></div>
                                <div class="h-6 bg-gray-200 dark:bg-gray-700 rounded-full animate-pulse w-12"></div>
                            </div>
                            <div class="h-8 bg-gray-200 dark:bg-gray-700 rounded-full animate-pulse w-full mt-3"></div>
                        </div>
                    </div>`).join('')}
                </div>
                <div id="endOfListHint" class="hidden text-center py-4 text-xs text-gray-300">—— 已经到底啦～ ——</div>
            </div>
        </div>
    </div>

    <div id="hoverPreview" tabindex="-1"></div>

    <!-- 置顶按钮（圆角向上三角） -->
    <div id="floatTopBtn" class="float-btn float-btn-top" title="回到顶部">
        <svg viewBox="0 0 16 16" fill="currentColor">
            <polygon points="8,2 2,10 14,10" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        </svg>
    </div>
    <!-- 置底按钮（圆角向下三角） -->
    <div id="floatBottomBtn" class="float-btn float-btn-bottom" title="去到底部">
        <svg viewBox="0 0 16 16" fill="currentColor">
            <polygon points="8,14 2,6 14,6" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        </svg>
    </div>

    <script>
        let records = [];
        let currentFilterType = 'all';
        let currentSearchKeyword = '';
        let currentYearFilter = null;
        let currentStatusFilter = null;
        let currentTagFilter = null;
        let currentDateFilter = null;
        let batchMode = false;
        let sortAscending = false;
        let currentViewMode = localStorage.getItem('recordViewMode') || 'grid';
        let noteFiles = [];
        let sourceIndex = new Map();
        let folderHandle = null;

        function showSkeleton() {
            document.getElementById('skeletonGrid')?.classList.remove('hidden');
        }
        function hideSkeleton() {
            document.getElementById('skeletonGrid')?.classList.add('hidden');
        }

        async function init() {
            showSkeleton();
            initPage('index', loadRecords, saveRecords);
            records = await loadRecords();
            folderHandle = await getFolderHandle();
            if (folderHandle) {
                const hasPermission = await verifyFolderPermission(folderHandle);
                if (hasPermission) {
                    noteFiles = await scanNotesFolder(folderHandle);
                    sourceIndex = buildSourceIndex(noteFiles);
                } else {
                    folderHandle = null;
                }
            }
            checkUrlParams();
            applyStatusFilterSetting();
            bindTabEvents();
            bindSearchBox();
            bindBatchButtons();
            bindTagCloudToggle();
            bindStatusButtons();
            bindSortOrderBtn();
            bindViewToggleBtn();
            bindFloatButtons();
            bindExportMdBtn();
            renderTagCloud();
            renderGroupedRecords();
        }

        function applyStatusFilterSetting() {
            const bar = document.getElementById('statusFilterBar');
            if (!bar) return;
            const show = localStorage.getItem('showStatusFilter');
            bar.style.display = show === 'false' ? 'none' : '';
        }

        document.addEventListener('DOMContentLoaded', init);

        window.addEventListener('pageshow', async (event) => {
            if (event.persisted) {
                records = await loadRecords();
                folderHandle = await getFolderHandle();
                if (folderHandle) {
                    const hasPermission = await verifyFolderPermission(folderHandle);
                    if (hasPermission) {
                        noteFiles = await scanNotesFolder(folderHandle);
                        sourceIndex = buildSourceIndex(noteFiles);
                    } else {
                        folderHandle = null;
                    }
                }
                checkUrlParams();
                renderGroupedRecords();
            }
        });

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                records = await loadRecords();
                folderHandle = await getFolderHandle();
                if (folderHandle) {
                    const hasPermission = await verifyFolderPermission(folderHandle);
                    if (hasPermission) {
                        noteFiles = await scanNotesFolder(folderHandle);
                        sourceIndex = buildSourceIndex(noteFiles);
                    } else {
                        folderHandle = null;
                    }
                }
                checkUrlParams();
                renderGroupedRecords();
            }
        });

        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const year = params.get('year');
            const status = params.get('status');
            const tag = params.get('tag');
            const type = params.get('type');
            const date = params.get('date');
            if (year) currentYearFilter = parseInt(year);
            if (status !== null) currentStatusFilter = status || null;
            if (tag) currentTagFilter = tag;
            if (type) currentFilterType = type;
            if (date) currentDateFilter = date;

            document.querySelectorAll('.tab-underline').forEach(btn => {
                const btnType = btn.dataset.type;
                btn.classList.toggle('active', btnType === currentFilterType);
            });
        }

        async function handleDeleteRecord(recordId) {
            if (confirm('确定删除这条观看记录吗？')) {
                await deleteRecord(recordId);
                records = await loadRecords();
                renderGroupedRecords();
            }
        }

        async function deleteGroup(groupTitle, groupType) {
            const displayName = (groupTitle && String(groupTitle).trim()) || '未命名';
            if (confirm(`确定删除《${displayName}》的所有观看记录吗？`)) {
                const titleStr = String(groupTitle || '').trim();
                const toDelete = records.filter(r => {
                    if (r.type !== groupType) return false;
                    const rTitle = String(r.title || '').trim();
                    if (titleStr === '' && rTitle === '') return true;
                    return rTitle === titleStr;
                });
                for (const r of toDelete) {
                    await deleteRecord(r.id);
                }
                records = await loadRecords();
                renderGroupedRecords();
            }
        }

        function goToRewatch(title, type) {
            const params = new URLSearchParams();
            params.set('rewatch', '1');
            params.set('title', title);
            params.set('type', type);
            window.location.href = 'add.html?' + params.toString();
        }

        function goToNewNote(title, type, tag) {
            if (!folderHandle) {
                alert('请先在笔记页面选择笔记文件夹，才能创建书摘/想法笔记。');
                return;
            }
            const params = new URLSearchParams();
            params.set('action', 'new');
            params.set('source', `${title}::${type}`);
            params.set('tags', tag);
            window.location.href = 'notes.html?' + params.toString();
        }

        function renderProgress(record) {
            const type = record.type;
            if ((type === 'series' || type === 'anime' || type === 'variety') && record.episodesTotal && record.episodesTotal > 0) {
                const watched = record.episodesWatched || 0;
                const percent = (watched / record.episodesTotal) * 100;
                return `
                    <div class="mb-2 progress-area">
                        <div class="flex justify-between text-xs text-gray-500 mb-0.5">
                            <span>集数进度</span>
                            <span>${watched} / ${record.episodesTotal}</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-1.5">
                            <div class="bg-indigo-500 h-1.5 rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        function renderLinkedNotes(group) {
            const linkedNotes = getNotesForSource(sourceIndex, group.title, group.type);
            let html = '';
            for (const nf of linkedNotes) {
                if (nf.tags.includes('书摘')) {
                    const preview = nf.bodyText ? escapeHtml(nf.bodyText.replace(/\n/g, ' ').substring(0, 80)) : '';
                    html += `<p class="text-xs text-gray-600 truncate note-preview-item" data-note-name="${escapeAttr(nf.name)}" data-note-content="${escapeAttr(nf.bodyText || '')}">📖 ${preview}${nf.bodyText.length > 80 ? '…' : ''}</p>`;
                }
            }
            const latestItem = group.items[0];
            if (latestItem?.thoughts) {
                const t = escapeHtml(String(latestItem.thoughts).substring(0, 80)).replace(/\n/g, '<br>');
                if (t) html += `<p class="text-xs text-gray-600 truncate hover-preview-item" data-preview-content="${escapeAttr(String(latestItem.thoughts))}" style="cursor:pointer;">💭 ${t}${latestItem.thoughts.length > 80 ? '…' : ''}</p>`;
            }
            if (latestItem?.goldenQuotes) {
                const q = escapeHtml(String(latestItem.goldenQuotes).substring(0, 80)).replace(/\n/g, '<br>');
                if (q) html += `<p class="text-xs text-gray-600 truncate hover-preview-item" data-preview-content="${escapeAttr(String(latestItem.goldenQuotes))}" style="cursor:pointer;">💬 ${q}${latestItem.goldenQuotes.length > 80 ? '…' : ''}</p>`;
            }
            return html;
        }

        function renderWatchItem(item, showWatchCount) {
            const startDate = item.startDate || '';
            const endDate = item.endDate || '';
            const progressHtml = renderProgress(item);

            if (showWatchCount) {
                const watchLabel = `<span class="text-lg font-semibold text-indigo-600 whitespace-nowrap mr-2">${item.watchCount || 1}刷</span>`;
                let dateBlock = '';
                if (startDate && endDate && startDate !== endDate) {
                    dateBlock = `<div class="text-right"><div class="text-xs text-gray-500">${escapeHtml(startDate)}</div><div class="text-xs text-gray-500">${escapeHtml(endDate)}</div></div>`;
                } else {
                    const single = endDate || startDate || item.viewYear || '日期不详';
                    dateBlock = `<div class="text-xs text-gray-500 text-right">${escapeHtml(single)}</div>`;
                }
                return `
                    <div class="border-t border-gray-100 pt-2 mt-2 first:border-0 first:pt-0 first:mt-0 watch-item" data-record-id="${item.id}">
                        ${progressHtml}
                        <div class="flex items-center justify-between mt-1">
                            <div class="flex items-center flex-1 min-w-0 mr-3">
                                ${watchLabel}
                                <div class="flex-1">${dateBlock}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const dateStr = (endDate || startDate || item.viewYear || '日期不详');
                return `
                    <div class="border-t border-gray-100 pt-2 mt-2 first:border-0 first:pt-0 first:mt-0 watch-item" data-record-id="${item.id}">
                        ${progressHtml}
                        <div class="flex items-center justify-between mt-1">
                            <div class="flex-1 min-w-0">
                                <span class="text-xs text-gray-500">${escapeHtml(dateStr)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function renderGroupHeader(group, firstItem, latestItem) {
            const statusText = latestItem?.status || firstItem.status || '';
            const statusBadge = statusText ? `<span class="inline-block bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded">${escapeHtml(statusText)}</span>` : '';
            const quoteBtn = `<button class="add-quote-btn text-amber-600 hover:text-amber-800 hover:bg-amber-50 p-1 rounded transition" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}" title="记书摘">${iconQuote('w-3.5 h-3.5')}</button>`;
            const thoughtBtn = `<button class="add-thought-btn text-purple-600 hover:text-purple-800 hover:bg-purple-50 p-1 rounded transition" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}" title="记想法">${iconThought('w-3.5 h-3.5')}</button>`;
            let html = `<div class="flex-1 min-w-0">
                <h3 class="font-bold text-lg text-gray-700">${escapeHtml(group.displayTitle || String(group.title))}</h3>`;
            if (statusBadge) {
                html += `<div class="mt-1">${statusBadge}</div>`;
            }
            html += `</div>`;
            html += `<div class="flex flex-col items-end flex-shrink-0 gap-1">
                <span class="inline-block bg-gray-100 text-gray-700 text-xs px-2 py-1 rounded whitespace-nowrap">${getTypeName(group.type)}</span>
                <div class="card-note-btns flex gap-0.5">${quoteBtn}${thoughtBtn}</div>
            </div>`;
            return html;
        }

        function renderRecordCard(group) {
            const firstItem = group.items[0];
            const latestItem = getLatestRecordForGroup(group);
            let coverUrl = latestItem?.imageUrl || firstItem.imageUrl || '';
            coverUrl = coverUrl ? String(coverUrl) : '';
            const showWatchCount = group.items.length > 1;

            const watchesHtml = group.items.map(item => renderWatchItem(item, showWatchCount)).join('');
            const headerHtml = renderGroupHeader(group, firstItem, latestItem);
            const linkedNotesHtml = renderLinkedNotes(group);

            return `
                <div class="bg-white rounded-lg shadow-md border border-gray-200 flex flex-col relative record-card">
                    <div class="batch-checkbox absolute top-2 left-2 z-10 hidden">
                        <input type="checkbox" class="batch-select w-5 h-5" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}">
                    </div>
                    ${coverUrl ? `<img class="w-full h-56 object-cover rounded-t-lg" src="${coverUrl}" alt="${escapeAttr(String(group.title))}" onerror="this.style.display='none'">` 
                    : `<div class="w-full h-56 bg-gray-100 flex items-center justify-center text-gray-400 rounded-t-lg">无封面</div>`}
                    <div class="p-4 flex-1">
                        <div class="flex justify-between items-start">
                            ${headerHtml}
                        </div>
                        ${firstItem.author ? `<p class="text-sm text-gray-600 truncate">作者：${escapeHtml(String(firstItem.author))}</p>` : ''}
                        ${firstItem.type === 'book' && firstItem.translator ? `<p class="text-sm text-gray-600 truncate">译者：${escapeHtml(String(firstItem.translator))}</p>` : ''}
                        ${firstItem.country ? `<p class="text-sm text-gray-600 truncate">国别：${escapeHtml(String(firstItem.country))}</p>` : ''}
                        ${firstItem.releaseYear ? `<p class="text-sm text-gray-600 truncate">上映：${escapeHtml(String(firstItem.releaseYear))}</p>` : ''}
                        ${Array.isArray(latestItem?.tags) && latestItem.tags.length > 0 ? `<div class="flex flex-wrap gap-1 mt-2">${latestItem.tags.map(tag => `<span class="inline-block bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded">${escapeHtml(tag)}</span>`).join('')}</div>` : ''}
                        ${linkedNotesHtml ? `<div class="mt-2">${linkedNotesHtml}</div>` : ''}
                        <div class="mt-3">
                            ${group.items.length > 1 ? '<p class="text-sm font-medium text-gray-700 mb-1">观看次数：</p>' : ''}
                            <div class="max-h-48 overflow-y-auto pr-1">${watchesHtml}</div>
                        </div>
                    </div>
                    <div class="px-4 pb-4 flex items-center justify-between gap-1 relative">
                        <button class="rewatch-btn text-xs font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-500 py-1.5 px-4 rounded-full transition whitespace-nowrap" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}">再刷一次</button>
                        <button class="delete-group-btn text-xs font-medium bg-red-50 hover:bg-red-100 text-red-600 py-1.5 px-4 rounded-full transition whitespace-nowrap" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}">删除全部</button>
                    </div>
                </div>
            `;
        }

        function groupRecords(recordsArray) {
            const groups = new Map();
            for (const rec of recordsArray) {
                const title = rec.title || '';
                const displayTitle = title || '未命名';
                const key = `${title}|${rec.type}`;
                if (!groups.has(key)) groups.set(key, { title, displayTitle, type: rec.type, items: [] });
                groups.get(key).items.push(rec);
            }
            for (const group of groups.values()) {
                group.items.sort((a, b) => {
                    const dateA = a.endDate || a.startDate || '0000-00-00';
                    const dateB = b.endDate || b.startDate || '0000-00-00';
                    return dateB.localeCompare(dateA);
                });
            }
            return Array.from(groups.values());
        }

        function getFilteredGroups() {
            let filteredRecords = records;
            if (currentFilterType !== 'all') filteredRecords = filteredRecords.filter(r => r.type === currentFilterType);
            if (currentYearFilter !== null) {
                filteredRecords = filteredRecords.filter(r => {
                    if (r.viewYear === currentYearFilter) return true;
                    if (r.startDate && parseInt(r.startDate.split('-')[0]) === currentYearFilter) return true;
                    return false;
                });
            }
            if (currentStatusFilter !== null) filteredRecords = filteredRecords.filter(r => r.status === currentStatusFilter);
            if (currentTagFilter !== null) {
                filteredRecords = filteredRecords.filter(r => {
                    return Array.isArray(r.tags) && r.tags.includes(currentTagFilter);
                });
            }
            if (currentDateFilter !== null) {
                filteredRecords = filteredRecords.filter(r => {
                    const start = r.startDate ? String(r.startDate).slice(0, 10) : '';
                    const end = r.endDate ? String(r.endDate).slice(0, 10) : '';
                    return start === currentDateFilter || end === currentDateFilter;
                });
            }
            if (currentSearchKeyword.trim() !== '') {
                const kw = currentSearchKeyword.trim().toLowerCase();
                filteredRecords = filteredRecords.filter(r => r.title && r.title.toLowerCase().includes(kw));
            }
            return groupRecords(filteredRecords);
        }

        function getAllTags() {
            const tagCount = {};
            records.forEach(r => {
                if (!Array.isArray(r.tags)) return;
                r.tags.forEach(tag => { if (tag) tagCount[tag] = (tagCount[tag] || 0) + 1; });
            });
            return Object.entries(tagCount).sort((a, b) => b[1] - a[1]);
        }

        function getLatestRecordForGroup(group) {
            if (!group.items.length) return null;
            return group.items[0];
        }

        function getTypeName(type) {
            const map = {
                book: '书籍', movie: '电影', anime: '动漫', series: '剧集', variety: '综艺'
            };
            return map[type] || type;
        }

        function renderRecordCardHorizontal(group) {
            const firstItem = group.items[0];
            const latestItem = getLatestRecordForGroup(group);
            const statusText = latestItem?.status || firstItem.status || '';
            const statusBadge = statusText ? `<span class="inline-block bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded">${escapeHtml(statusText)}</span>` : '';
            const tagsHtml = Array.isArray(latestItem?.tags) && latestItem.tags.length > 0
                ? latestItem.tags.map(t => `<span class="tag-pill" style="cursor:pointer;display:inline-block;background-color:rgba(159,184,196,0.15);color:var(--c-accent);font-size:0.65rem;padding:0.05rem 0.4rem;border-radius:9999px;margin-right:0.15rem;" data-tag="${escapeAttr(t)}">${escapeHtml(t)}</span>`).join('')
                : '';

            const linkedNotesHtml = renderLinkedNotes(group);
            const watchDatesHtml = group.items.map(item => {
                const d = item.endDate || item.startDate || item.viewYear || '';
                return d ? `<span class="watch-date-entry" data-record-id="${item.id}"><span class="text-indigo-600 font-semibold">${item.watchCount || 1}刷</span> <span class="text-gray-500">${d}</span></span>` : '';
            }).filter(Boolean).join(' <span class="text-gray-300">·</span> ');

            let coverUrl = latestItem?.imageUrl || firstItem.imageUrl || '';
            coverUrl = coverUrl ? String(coverUrl) : '';

            const quoteBtn = `<button class="add-quote-btn text-amber-600 hover:text-amber-800 hover:bg-amber-50 p-1 rounded transition" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}" title="记书摘">${iconQuote('w-3.5 h-3.5')}</button>`;
            const thoughtBtn = `<button class="add-thought-btn text-purple-600 hover:text-purple-800 hover:bg-purple-50 p-1 rounded transition" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}" title="记想法">${iconThought('w-3.5 h-3.5')}</button>`;

            return `
                <div class="record-card-horizontal group justify-between" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}">
                    <div class="batch-checkbox hidden flex-shrink-0">
                        <input type="checkbox" class="batch-select w-4 h-4" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}">
                    </div>
                    <div class="flex items-center min-w-0 flex-1">
                    ${coverUrl ? `<img class="w-16 h-20 object-cover rounded flex-shrink-0 mr-3" src="${coverUrl}" alt="${escapeAttr(String(group.title))}" onerror="this.style.display='none'">` : `<div class="w-16 h-20 flex-shrink-0 mr-3"></div>`}
                    <div class="min-w-0 w-44">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h3 class="font-bold text-base text-gray-700">${escapeHtml(group.displayTitle || String(group.title))}</h3>
                            <span class="inline-block bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded whitespace-nowrap flex-shrink-0">${getTypeName(group.type)}</span>
                            ${statusBadge}
                        </div>
                        <div class="text-xs text-gray-500 mt-1 truncate">
                            ${firstItem.author ? escapeHtml(String(firstItem.author)) : ''}${firstItem.author && firstItem.country ? ' · ' : ''}${firstItem.country ? escapeHtml(String(firstItem.country)) : ''}${(firstItem.author || firstItem.country) && firstItem.releaseYear ? ' · ' : ''}${firstItem.releaseYear ? escapeHtml(String(firstItem.releaseYear)) : ''}
                        </div>
                        ${tagsHtml ? `<div class="flex flex-wrap gap-0.5 mt-1">${tagsHtml}</div>` : ''}
                        ${watchDatesHtml ? `<div class="watch-date-line mt-1 text-xs">${watchDatesHtml}</div>` : ''}
                    </div>
                    ${linkedNotesHtml ? `<div class="text-xs text-gray-600 leading-snug space-y-1 shrink min-w-0">${linkedNotesHtml}</div>` : ''}
                    </div>
                    <div class="card-note-btns flex items-center gap-1 flex-shrink-0 ml-3">
                        <button class="rewatch-btn text-xs font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-500 py-1 px-2 rounded-full transition whitespace-nowrap" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}">再刷</button>
                        <button class="delete-group-btn text-xs font-medium bg-red-50 hover:bg-red-100 text-red-600 py-1 px-2 rounded-full transition whitespace-nowrap" data-title="${escapeAttr(String(group.title))}" data-type="${escapeAttr(group.type)}">删除</button>
                        ${quoteBtn}${thoughtBtn}
                    </div>
                </div>
            `;
        }

        function renderGroupedRecords() {
            hideSkeleton();
            const container = document.getElementById('recordsDisplay');
            if (!container) return;
            const countLabel = document.getElementById('recordCount');
            const groups = getFilteredGroups().sort((a, b) => {
                const getLastDate = (group) => {
                    const latest = group.items[0];
                    return latest.endDate || latest.startDate || '0000-00-00';
                };
                const dateA = getLastDate(a);
                const dateB = getLastDate(b);
                const timeCompare = dateB.localeCompare(dateA);
                if (timeCompare !== 0) return sortAscending ? -timeCompare : timeCompare;
                const titleA = a.title || '';
                const titleB = b.title || '';
                return titleA.localeCompare(titleB, 'zh');
            });
            if (countLabel) countLabel.textContent = `共 ${groups.length} 部作品`;
            if (groups.length === 0) {
                const hasAnyRecords = records.length > 0;
                const isSearching = currentSearchKeyword.trim() !== '' || currentFilterType !== 'all' || currentStatusFilter !== null || currentTagFilter !== null || currentYearFilter !== null || currentDateFilter !== null;
                if (hasAnyRecords && isSearching) {
                    container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10"><p class="text-lg mb-1">没有匹配的作品</p><p class="text-sm">试试其他关键词或筛选条件</p></div>';
                } else {
                    container.innerHTML = '<div class="col-span-full text-center py-16">'
                        + '<p class="text-xl text-gray-500 mb-2">还没有任何记录</p>'
                        + '<p class="text-sm text-gray-400 mb-8">记录你读过的书、看过的电影和剧集吧</p>'
                        + '<a href="add.html" class="inline-block px-8 py-3 bg-indigo-600 text-white rounded-lg text-base font-medium hover:bg-indigo-700 transition shadow-md hover:shadow-lg">＋ 添加第一条记录</a>'
                        + '</div>';
                }
                document.getElementById('endOfListHint')?.classList.add('hidden');
                return;
            }

            if (currentViewMode === 'list') {
                container.innerHTML = groups.map(group => renderRecordCardHorizontal(group)).join('');
                container.innerHTML += `<div class="text-center py-4 border-t border-gray-200"><a href="add.html" class="text-sm text-indigo-500 hover:text-indigo-700">＋ 添加作品</a></div>`;
            } else {
                container.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4';
                container.innerHTML = groups.map(group => renderRecordCard(group)).join('');
            }

            document.querySelectorAll('.delete-group-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteGroup(btn.dataset.title, btn.dataset.type));
            });
            document.querySelectorAll('.rewatch-btn').forEach(btn => {
                btn.addEventListener('click', () => goToRewatch(btn.dataset.title, btn.dataset.type));
            });
            document.querySelectorAll('.add-quote-btn').forEach(btn => {
                btn.addEventListener('click', () => goToNewNote(btn.dataset.title, btn.dataset.type, '书摘'));
            });
            document.querySelectorAll('.add-thought-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const matched = records.filter(r => r.title === btn.dataset.title && r.type === btn.dataset.type);
                    const latest = matched.sort((a, b) => b.id - a.id)[0];
                    if (latest) window.location.href = 'add.html?id=' + latest.id;
                });
            });
            document.querySelectorAll('.batch-checkbox').forEach(el => el.classList.toggle('hidden', !batchMode));
            document.getElementById('batchToolbar')?.classList.toggle('hidden', !batchMode);

            document.querySelectorAll('.watch-item').forEach(item => {
                item.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const recordId = parseInt(item.dataset.recordId);
                    if (!recordId) return;
                    window.createContextMenu([
                        { label: '编辑', icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>', action: () => { window.location.href = `add.html?id=${recordId}`; } },
                        { label: '删除', icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h10M6 4V2.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5V4m1 0v9.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4h7Z"/></svg>', danger: true, action: () => handleDeleteRecord(recordId) },
                    ], e);
                });
            });

            document.querySelectorAll('.record-card-horizontal').forEach(card => {
                card.addEventListener('contextmenu', (e) => {
                    if (e.target.closest('.watch-date-line')) return;
                    e.preventDefault();
                    e.stopPropagation();
                    const title = card.dataset.title;
                    const type = card.dataset.type;
                    if (title === undefined || title === null || !type) return;
                    window.createContextMenu([
                        { label: '再刷一次', icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2 8a6 6 0 1 1 1.5 4"/><path stroke-linecap="round" d="M2 12V8h4"/></svg>', action: () => goToRewatch(title, type) },
                        { label: '删除全部', icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h10M6 4V2.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5V4m1 0v9.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4h7Z"/></svg>', danger: true, action: () => deleteGroup(title, type) },
                    ], e);
                });
            });

            document.querySelectorAll('.record-card-horizontal .watch-date-line').forEach(line => {
                line.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const card = line.closest('.record-card-horizontal');
                    const title = card?.dataset.title;
                    const type = card?.dataset.type;
                    if (title === undefined || title === null || !type) return;
                    const dateEntry = e.target.closest('.watch-date-entry');
                    const recordId = dateEntry ? dateEntry.dataset.recordId : null;
                    if (!recordId) return;
                    window.createContextMenu([
                        { label: '编辑', icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>', action: () => { if (recordId) window.location.href = `add.html?id=${recordId}`; } },
                        { label: '删除', icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h10M6 4V2.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5V4m1 0v9.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4h7Z"/></svg>', danger: true, action: () => { if (recordId) handleDeleteRecord(recordId); } },
                    ], e);
                });
            });

            document.querySelectorAll('.tag-pill').forEach(pill => {
                pill.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const tag = pill.dataset.tag;
                    if (tag) {
                        currentTagFilter = tag;
                        document.getElementById('tagCloud').classList.remove('hidden');
                        document.getElementById('toggleTagCloudBtn').textContent = '隐藏标签栏';
                        renderTagCloud();
                        renderGroupedRecords();
                    }
                });
            });

            document.querySelectorAll('.hover-preview-item').forEach(el => {
                el.style.cursor = 'pointer';
                el.addEventListener('mouseenter', (e) => {
                    clearTimeout(hoverTimeout);
                    hoverTimeout = setTimeout(() => showHoverPreview(el.dataset.previewContent, e), 200);
                });
                el.addEventListener('mousemove', (e) => {
                    const preview = document.getElementById('hoverPreview');
                    if (preview.style.display === 'block') positionHoverPreview(e);
                });
                el.addEventListener('mouseleave', () => {
                    clearTimeout(hoverTimeout);
                    hoverTimeout = setTimeout(() => hideHoverPreview(), 200);
                });
            });

            document.querySelectorAll('.note-preview-item').forEach(el => {
                el.style.cursor = 'pointer';
                el.addEventListener('mouseenter', (e) => {
                    clearTimeout(hoverTimeout);
                    hoverTimeout = setTimeout(() => showHoverPreview(el.dataset.noteContent, e, el.dataset.noteName), 200);
                });
                el.addEventListener('mousemove', (e) => {
                    const preview = document.getElementById('hoverPreview');
                    if (preview.style.display === 'block') positionHoverPreview(e);
                });
                el.addEventListener('mouseleave', () => {
                    clearTimeout(hoverTimeout);
                    hoverTimeout = setTimeout(() => hideHoverPreview(), 200);
                });
            });

            const previewEl = document.getElementById('hoverPreview');
            if (previewEl) {
                previewEl.addEventListener('mouseenter', () => {
                    clearTimeout(hoverTimeout);
                });
                previewEl.addEventListener('mouseleave', () => {
                    hideHoverPreview();
                });
                previewEl.addEventListener('wheel', (e) => {
                    e.stopPropagation();
                });
            }

            if (currentViewMode === 'list') {
                container.className = '';
                container.style.display = 'block';
                document.querySelectorAll('.record-card-horizontal').forEach(item => {
                    item.addEventListener('click', (e) => {
                        if (e.target.closest('.card-note-btns') || e.target.closest('.batch-checkbox') || e.target.closest('.tag-pill')) return;
                        if (batchMode) {
                            const cb = item.querySelector('.batch-select');
                            if (cb) cb.checked = !cb.checked;
                            return;
                        }
                    });
                });
            } else {
                container.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4';
                container.style.display = '';
            }

            document.getElementById('endOfListHint')?.classList.remove('hidden');
        }

        let hoverTimeout = null;

        function showHoverPreview(mdContent, event, noteName) {
            const preview = document.getElementById('hoverPreview');
            if (!preview || !mdContent) return;
            let html;
            if (typeof marked !== 'undefined' && marked.parse) {
                html = marked.parse(mdContent);
            } else {
                html = escapeHtml(mdContent).replace(/\n/g, '<br>');
            }
            if (mdContent.length > 500) {
                const safeName = escapeAttr(noteName || '');
                html += `<div class="truncation-hint" style="cursor:pointer;text-decoration:underline;margin-top:0.5em;color:var(--c-accent,#6366f1);" onclick="event.stopPropagation();window._openNoteForPreview('${safeName}');">...（点击查看完整笔记）</div>`;
            }
            preview.innerHTML = html;
            preview.style.display = 'block';
            preview.focus();
            positionHoverPreview(event);
        }

        window._openNoteForPreview = (noteName) => {
            if (noteName) {
                const name = noteName.replace(/\.md$/i, '');
                const encoded = encodeURIComponent(name);
                window.location.href = `notes.html?q=${encoded}`;
            } else {
                window.location.href = 'notes.html';
            }
        };

        function positionHoverPreview(event) {
            const preview = document.getElementById('hoverPreview');
            if (!preview) return;
            const offset = 12;
            let x = event.clientX + offset;
            let y = event.clientY + offset;
            const rect = preview.getBoundingClientRect();
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            if (x + rect.width > vw - 10) x = event.clientX - rect.width - offset;
            if (y + rect.height > vh - 10) y = Math.max(10, event.clientY - rect.height - offset);
            if (x < 10) x = 10;
            if (y < 10) y = 10;
            preview.style.left = x + 'px';
            preview.style.top = y + 'px';
        }

        function hideHoverPreview() {
            const preview = document.getElementById('hoverPreview');
            if (preview) preview.style.display = 'none';
        }

        function exitBatchMode() {
            batchMode = false;
            const toggleBtn = document.getElementById('batchToggleBtn');
            if (toggleBtn) {
                toggleBtn.textContent = '批量操作';
                toggleBtn.classList.remove('active');
            }
            renderGroupedRecords();
        }

        function bindTabEvents() {
            document.querySelectorAll('.tab-underline').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const type = e.currentTarget.dataset.type;
                    if (!type) return;
                    currentFilterType = type;
                    document.querySelectorAll('.tab-underline').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.type === type);
                    });
                    renderGroupedRecords();
                });
            });
        }

        function bindSearchBox() {
            const searchInput = document.getElementById('searchBox');
            if (!searchInput) return;
            let searchTimer;
            let isComposing = false;
            function doSearch() {
                currentSearchKeyword = searchInput.value;
                renderGroupedRecords();
            }
            searchInput.addEventListener('compositionstart', () => { isComposing = true; });
            searchInput.addEventListener('compositionend', () => {
                isComposing = false;
                doSearch();
            });
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimer);
                if (isComposing) return;
                searchTimer = setTimeout(doSearch, 300);
            });
        }

        function bindBatchButtons() {
            const toggleBtn = document.getElementById('batchToggleBtn');
            const toolbar = document.getElementById('batchToolbar');
            if (!toggleBtn || !toolbar) return;

            toggleBtn.addEventListener('click', () => {
                batchMode = !batchMode;
                toggleBtn.textContent = batchMode ? '退出批量' : '批量操作';
                toggleBtn.classList.toggle('active', batchMode);
                renderGroupedRecords();
            });

            document.getElementById('batchDeleteBtn')?.addEventListener('click', async () => {
                const selected = getSelectedRecords();
                if (selected.length === 0) return alert('请先勾选要删除的作品');
                if (!confirm(`确定删除选中的 ${selected.length} 部作品的所有记录吗？`)) return;
                for (const { title, type } of selected) {
                    const toDelete = records.filter(r => r.type === type && (r.title === title || (!title && !r.title)));
                    for (const r of toDelete) {
                        await deleteRecord(r.id);
                    }
                }
                records = await loadRecords();
                exitBatchMode();
                renderGroupedRecords();
            });

            document.getElementById('batchTagBtn')?.addEventListener('click', async () => {
                const selected = getSelectedRecords();
                if (selected.length === 0) return alert('请先勾选作品');
                const newTag = document.getElementById('batchTagInput')?.value.trim();
                if (!newTag) return alert('请输入新标签');
                const newTags = newTag.split(/[,，]/).map(t => t.trim()).filter(t => t);
                const updates = [];
                for (const { title, type } of selected) {
                    for (const r of records.filter(rec => rec.type === type && (rec.title === title || (!title && !rec.title)))) {
                        updates.push({ id: r.id, updates: { tags: newTags } });
                    }
                }
                if (updates.length) await batchUpdateRecords(updates);
                records = await loadRecords();
                exitBatchMode();
                renderGroupedRecords();
                renderTagCloud();
                alert('标签修改成功！');
            });
        }

        function getSelectedRecords() {
            const checkboxes = document.querySelectorAll('.batch-select:checked');
            const selected = [];
            const seen = new Set();
            checkboxes.forEach(cb => {
                const key = cb.dataset.title + '||' + cb.dataset.type;
                if (!seen.has(key)) {
                    seen.add(key);
                    selected.push({ title: cb.dataset.title, type: cb.dataset.type });
                }
            });
            return selected;
        }

        function bindTagCloudToggle() {
            const btn = document.getElementById('toggleTagCloudBtn');
            const cloud = document.getElementById('tagCloud');
            if (!btn || !cloud) return;

            btn.addEventListener('click', () => {
                const isHidden = cloud.classList.contains('hidden');
                if (isHidden) {
                    cloud.classList.remove('hidden');
                    btn.textContent = '隐藏标签';
                    renderTagCloud();
                } else {
                    cloud.classList.add('hidden');
                    btn.textContent = '标签筛选';
                }
            });
        }

        function bindStatusButtons() {
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.removeEventListener('click', handleStatusClick);
                btn.addEventListener('click', handleStatusClick);
            });
        }

        function handleStatusClick(e) {
            const status = e.currentTarget.dataset.status;
            currentStatusFilter = status === '' ? null : status;
            document.querySelectorAll('.status-btn').forEach(btn => {
                const isActive = btn.dataset.status === (currentStatusFilter || '');
                btn.classList.toggle('bg-indigo-600', isActive);
                btn.classList.toggle('text-white', isActive);
                btn.classList.toggle('bg-gray-200', !isActive);
                btn.classList.toggle('text-gray-700', !isActive);
            });
            renderGroupedRecords();
        }

        function bindSortOrderBtn() {
            const btn = document.getElementById('sortOrderBtn');
            if (!btn) return;
            btn.addEventListener('click', () => {
                sortAscending = !sortAscending;
                btn.textContent = sortAscending ? '升序' : '降序';
                renderGroupedRecords();
            });
        }

        function bindViewToggleBtn() {
            const btn = document.getElementById('viewToggleBtn');
            const icon = document.getElementById('viewToggleIcon');
            if (!btn || !icon) return;
            const updateIcon = () => {
                if (currentViewMode === 'list') {
                    icon.innerHTML = '<svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>';
                } else {
                    icon.innerHTML = '<svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h7v7H3V4zm11 0h7v7h-7V4zM3 15h7v7H3v-7zm11 0h7v7h-7v-7z"/></svg>';
                }
            };
            updateIcon();
            btn.addEventListener('click', () => {
                currentViewMode = currentViewMode === 'grid' ? 'list' : 'grid';
                localStorage.setItem('recordViewMode', currentViewMode);
                updateIcon();
                renderGroupedRecords();
            });
        }

        function bindFloatButtons() {
            document.getElementById('floatTopBtn').addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            document.getElementById('floatBottomBtn').addEventListener('click', () => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            });
        }

        function bindExportMdBtn() {
            const btn = document.getElementById('exportMdBtn');
            if (!btn) return;
            btn.addEventListener('click', () => {
                const groups = getFilteredGroups().sort((a, b) => {
                    const latestA = a.items[0];
                    const latestB = b.items[0];
                    const dateA = latestA.endDate || latestA.startDate || '0000-00-00';
                    const dateB = latestB.endDate || latestB.startDate || '0000-00-00';
                    return dateB.localeCompare(dateA);
                });
                const rows = [];
                rows.push('| 标题 | 类型 | 状态 | 观看次数 | 开始日期 | 结束日期 | 作者 | 译者 | 国别 | 上映年份 | 标签 |');
                rows.push('|------|------|------|----------|----------|----------|------|------|------|----------|------|');
                for (const group of groups) {
                    const latest = group.items[0];
                    const title = String(group.title || '');
                    const type = getTypeName(String(group.type || ''));
                    const status = latest.status || '';
                    const watchCount = latest.watchCount || 1;
                    const startDate = latest.startDate || '';
                    const endDate = latest.endDate || '';
                    const author = latest.author || '';
                    const translator = latest.translator || '';
                    const country = latest.country || '';
                    const releaseYear = latest.releaseYear || '';
                    const tags = Array.isArray(latest.tags) ? latest.tags.join(', ') : '';
                    rows.push(`| ${title} | ${type} | ${status} | ${watchCount} | ${startDate} | ${endDate} | ${author} | ${translator} | ${country} | ${releaseYear} | ${tags} |`);
                }
                const md = rows.join('\n');
                const blob = new Blob([md], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `书影音记录_${new Date().toISOString().slice(0,10)}.md`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function renderTagCloud() {
            const container = document.getElementById('tagCloud');
            if (!container) return;
            const tags = getAllTags();
            if (tags.length === 0) { container.innerHTML = ''; return; }
            container.innerHTML = `
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-sm text-gray-500 font-medium">标签：</span>
                    <button class="tag-btn px-3 py-1 rounded-full text-sm transition ${currentTagFilter === null ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}" data-tag="">全部</button>
                    ${tags.map(([tag, count]) => `
                        <button class="tag-btn px-3 py-1 rounded-full text-sm transition ${currentTagFilter === tag ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}" data-tag="${escapeAttr(tag)}">${escapeHtml(tag)} (${count})</button>
                    `).join('')}
                </div>
            `;
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const tag = e.currentTarget.dataset.tag;
                    currentTagFilter = tag === '' ? null : tag;
                    renderTagCloud();
                    renderGroupedRecords();
                });
                btn.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const tag = btn.dataset.tag;
                    if (!tag) return;
                    window.createContextMenu([
                        { label: '删除标签', icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h10M6 4V2.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5V4m1 0v9.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4h7Z"/></svg>', danger: true, action: () => deleteTagFromRecords(tag) },
                        { label: '合并标签', icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 3v10M3 8h10"/></svg>', action: () => mergeTagInRecords(tag) },
                    ], e);
                });
            });
        }

        async function deleteTagFromRecords(tag) {
            if (!confirm(`确定从所有书影音记录中删除标签「${tag}」吗？`)) return;
            const allRecords = await loadRecords();
            const updates = [];
            for (const rec of allRecords) {
                if (!Array.isArray(rec.tags) || !rec.tags.includes(tag)) continue;
                updates.push({ id: rec.id, updates: { tags: rec.tags.filter(t => t !== tag) } });
            }
            if (updates.length) await batchUpdateRecords(updates);
            records = await loadRecords();
            renderTagCloud();
            renderGroupedRecords();
        }

        async function mergeTagInRecords(oldTag) {
            const allTags = new Set();
            records.forEach(r => {
                if (Array.isArray(r.tags)) r.tags.forEach(t => { if (t !== oldTag) allTags.add(t); });
            });
            const sortedTags = Array.from(allTags).sort();
            const input = prompt(`将标签「${oldTag}」合并到：\n可用标签：${sortedTags.join(', ')}`);
            if (!input || !input.trim()) return;
            const newTag = input.trim();
            if (newTag === oldTag) return;
            const allRecords = await loadRecords();
            const updates = [];
            for (const rec of allRecords) {
                if (!Array.isArray(rec.tags) || !rec.tags.includes(oldTag)) continue;
                const newTags = rec.tags.filter(t => t !== oldTag);
                if (!newTags.includes(newTag)) newTags.push(newTag);
                updates.push({ id: rec.id, updates: { tags: newTags } });
            }
            if (updates.length) await batchUpdateRecords(updates);
            renderTagCloud();
            renderGroupedRecords();
        }
    </script>
</body>
</html>
