<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>又记 - 素材</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: {} } }
    </script>
    <link rel="stylesheet" href="styles/theme.css">
    <script src="common.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/icons.js"></script>
    <script src="db.js"></script>
</head>
<body class="min-h-screen">
    <div class="flex min-h-screen">
        <div id="sidebar-container"></div>
        <div class="flex-1 ml-16 p-4 sm:p-8 min-w-0 flex flex-col" style="min-height:0;">
            <div class="flex-shrink-0">
                <div class="flex items-center justify-between mb-6">
                    <h1 class="text-2xl font-bold text-gray-600">素材</h1>
                    <div class="flex items-center gap-3">
                        <button id="selectFolderBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-md text-sm hover:bg-indigo-700">选择素材文件夹</button>
                        <button id="rescanBtn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md text-sm hover:bg-gray-300 hidden">重新扫描</button>
                    </div>
                </div>
                <div id="scanProgress" class="hidden mb-4 p-3 bg-indigo-50 rounded-md text-sm text-indigo-700"></div>
            </div>
            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-center py-16">
                <p class="text-xl text-gray-400 mb-2">选择素材文件夹</p>
                <p class="text-sm text-gray-300">支持 JPG / PNG / WebP / GIF 等常见图片格式</p>
            </div>
            <div id="galleryMain" class="hidden" style="position:relative;overflow:hidden;flex:1;min-height:0;">
                    <div id="folderTree" class="border border-gray-200 rounded-lg bg-white dark:bg-[#262932] dark:border-gray-600 text-sm" style="position:absolute;top:0;left:0;bottom:0;width:14rem;overflow-y:auto;"></div>
                    <div class="min-w-0" style="position:absolute;top:0;left:calc(14rem + 1rem);right:0;bottom:0;overflow-y:auto;">
                        <div id="folderPath" class="text-xs text-gray-400 mb-2 px-1"></div>
                        <div id="sortBar" class="flex items-center gap-2 mb-2 px-1 text-xs">
                            <span class="text-gray-400">排序</span>
                            <button class="sort-btn px-2 py-0.5 rounded border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700" data-sort="name">名称</button>
                            <button class="sort-btn px-2 py-0.5 rounded border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700" data-sort="type">类型</button>
                            <button class="sort-btn px-2 py-0.5 rounded border border-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700" data-sort="mtime">修改时间</button>
                        </div>
                        <div id="fileGrid" class="gallery-masonry"></div>
                        <style>
                            .gallery-masonry { position: relative; }
                            .gallery-masonry .gallery-item { position: absolute; overflow: hidden; width: calc(20% - 0.4rem); }
                            @media (max-width: 1024px) { .gallery-masonry .gallery-item { width: calc(25% - 0.375rem); } }
                            @media (max-width: 768px) { .gallery-masonry .gallery-item { width: calc(33.33% - 0.333rem); } }
                            @media (max-width: 480px) { .gallery-masonry .gallery-item { width: calc(50% - 0.25rem); } }
                        </style>
                        <div id="fileCount" class="text-xs text-gray-300 mt-2"></div>
                    </div>
                </div>
            </div>
        </div>

    <script>
        let galleryHandle = null;
        let currentFolder = '';
        let isScanning = false;
        let pageSize = 50;
        let currentPage = 0;
        let galleryTotal = 0;
        let collapsedFolders = new Set();
        let currentSort = 'name';
        let currentSortDir = 'asc';
        let sortedCache = [];
        let viewerPaths = [];
        let viewerIndex = -1;

        async function init() {
            initPage('gallery');
            galleryHandle = await getGalleryFolderHandle();
            if (galleryHandle) {
                const ok = await verifyFolderPermission(galleryHandle);
                if (ok) {
                    document.getElementById('emptyState').classList.add('hidden');
                    document.getElementById('galleryMain').classList.remove('hidden');
                    document.getElementById('selectFolderBtn').textContent = '更换文件夹';
                    document.getElementById('rescanBtn').classList.remove('hidden');
                    renderFolderTree();
                    renderFolder('/');
                }
            }
            document.getElementById('selectFolderBtn').addEventListener('click', selectGalleryFolder);
            document.getElementById('rescanBtn').addEventListener('click', startScan);
            function updateSortUI() {
                document.querySelectorAll('.sort-btn').forEach(b => {
                    const active = b.dataset.sort === currentSort;
                    b.classList.toggle('bg-indigo-100', active);
                    b.classList.toggle('dark:bg-indigo-900/30', active);
                    b.classList.toggle('text-indigo-700', active);
                    b.classList.toggle('dark:text-indigo-300', active);
                    const label = b.dataset.label || b.textContent;
                    if (!b.dataset.label) b.dataset.label = b.textContent;
                    const arrow = active ? (currentSortDir === 'asc' ? ' ↑' : ' ↓') : '';
                    b.textContent = label + arrow;
                });
            }
            document.getElementById('sortBar').addEventListener('click', (e) => {
                const btn = e.target.closest('.sort-btn');
                if (!btn) return;
                const sort = btn.dataset.sort;
                if (sort === currentSort) {
                    currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort = sort;
                    currentSortDir = sort === 'mtime' ? 'desc' : 'asc';
                }
                updateSortUI();
                renderFolder(currentFolder);
            });
            updateSortUI();
        }

        async function selectGalleryFolder() {
            try {
                const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
                const ok = await verifyFolderPermission(handle);
                if (!ok) return alert('需要文件夹权限');
                galleryHandle = handle;
                await saveGalleryFolderHandle(handle);
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('galleryMain').classList.remove('hidden');
                document.getElementById('selectFolderBtn').textContent = '更换文件夹';
                document.getElementById('rescanBtn').classList.remove('hidden');
                await startScan();
            } catch (e) {
                if (e.name !== 'AbortError') alert('选择文件夹失败：' + e.message);
            }
        }

        async function startScan() {
            if (isScanning) return;
            isScanning = true;
            const progress = document.getElementById('scanProgress');
            progress.classList.remove('hidden');
            progress.textContent = '准备扫描...';

            const db = await openDB();

            // 先清理旧数据
            progress.textContent = '清理旧数据...';
            await new Promise((resolve) => {
                const tx = db.transaction('gallery', 'readwrite');
                tx.objectStore('gallery').clear();
                tx.oncomplete = resolve;
            });

            let count = 0;
            const batchSize = 200;
            let batch = [];
            let dirQueue = [{ handle: galleryHandle, path: '' }];

            async function processQueue() {
                while (dirQueue.length > 0) {
                    const { handle, path } = dirQueue.shift();
                    let dirEntries;
                    try {
                        dirEntries = [];
                        for await (const e of handle.values()) dirEntries.push(e);
                    } catch (e) {
                        console.warn('跳过目录:', path, e);
                        continue;
                    }

                    const subdirs = [];
                    for (const entry of dirEntries) {
                        if (entry.kind === 'file') {
                            const ext = entry.name.split('.').pop().toLowerCase();
                            if (!['jpg','jpeg','png','gif','webp','bmp','svg','ico','avif','tiff','tif'].includes(ext)) continue;
                            let mtime = 0;
                            try { const f = await entry.getFile(); mtime = f.lastModified; } catch(e) {}
                            batch.push({
                                path: path + '/' + entry.name,
                                name: entry.name,
                                folder: path || '/',
                                type: ext,
                                mtime,
                            });
                            count++;
                            if (batch.length >= batchSize) {
                                await flushBatch(db, batch);
                                batch = [];
                                progress.textContent = `已扫描 ${count} 个文件...`;
                                await new Promise(r => setTimeout(r, 0));
                            }
                        } else if (entry.kind === 'directory') {
                            subdirs.push(entry);
                        }
                    }
                    // 子目录加入队列（广度优先）
                    for (const sd of subdirs) {
                        dirQueue.push({ handle: sd, path: path + '/' + sd.name });
                    }
                    // 每处理完一个目录让出主线程
                    if (count % 500 < batchSize) await new Promise(r => setTimeout(r, 0));
                }
            }

            try {
                await processQueue();
                if (batch.length > 0) await flushBatch(db, batch);
                progress.textContent = `扫描完成，共 ${count} 个文件`;
            } catch (e) {
                progress.textContent = '扫描出错：' + e.message;
                console.error('扫描失败', e);
            }
            isScanning = false;
            if (count > 0) {
                renderFolderTree();
                renderFolder('/');
            }
        }

        async function flushBatch(db, batch) {
            return new Promise((resolve) => {
                const tx = db.transaction('gallery', 'readwrite');
                const store = tx.objectStore('gallery');
                for (const item of batch) store.put(item);
                tx.oncomplete = resolve;
            });
        }

        async function loadFileCount(folder) {
            try {
                const db = await openDB();
                const tx = db.transaction('gallery', 'readonly');
                const store = tx.objectStore('gallery');
                const index = store.index('folder');
                return await new Promise((resolve) => {
                    const req = index.count(folder);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(0);
                });
            } catch (e) {
                console.warn('loadFileCount fallback', e);
                return (await loadFilesByFolder(folder, 0, 999999)).length;
            }
        }

        async function loadFilesByFolder(folder, offset, limit) {
            try {
                const db = await openDB();
                const tx = db.transaction('gallery', 'readonly');
                const store = tx.objectStore('gallery');
                const index = store.index('folder');
                return await new Promise((resolve) => {
                    const results = [];
                    let skipped = 0;
                    const req = index.openCursor(folder);
                    req.onsuccess = () => {
                        const cursor = req.result;
                        if (!cursor) return resolve(results);
                        if (skipped < offset) { skipped++; cursor.continue(); return; }
                        if (results.length >= limit) return resolve(results);
                        results.push(cursor.value);
                        cursor.continue();
                    };
                    req.onerror = () => resolve(results);
                });
            } catch (e) {
                console.warn('loadFilesByFolder fallback to getAll', e);
                // 索引不存在时兜底：全量加载后 JS 过滤
                try {
                    const db = await openDB();
                    const tx = db.transaction('gallery', 'readonly');
                    const all = await new Promise((r) => {
                        const req = tx.objectStore('gallery').getAll();
                        req.onsuccess = () => r(req.result || []);
                        req.onerror = () => r([]);
                    });
                    const filtered = all.filter(f => (f.folder || '/') === folder);
                    return filtered.slice(offset, offset + limit);
                } catch(e2) {
                    console.warn('loadFilesByFolder fallback also failed', e2);
                    return [];
                }
            }
        }

        async function getAllFolders() {
            const db = await openDB();
            return new Promise((resolve) => {
                const tx = db.transaction('gallery', 'readonly');
                const req = tx.objectStore('gallery').openCursor();
                const folders = new Set(['/']);
                req.onsuccess = () => {
                    const cursor = req.result;
                    if (!cursor) return resolve(Array.from(folders).sort());
                    const parts = (cursor.value.folder || '').split('/').filter(Boolean);
                    let path = '';
                    for (const p of parts) { path = path + '/' + p; folders.add(path); }
                    cursor.continue();
                };
                req.onerror = () => resolve(['/']);
            });
        }

        async function getFolderCounts() {
            const db = await openDB();
            return new Promise((resolve) => {
                const tx = db.transaction('gallery', 'readonly');
                const req = tx.objectStore('gallery').openCursor();
                const counts = {};
                req.onsuccess = () => {
                    const cursor = req.result;
                    if (!cursor) return resolve(counts);
                    const folder = cursor.value.folder || '/';
                    counts[folder] = (counts[folder] || 0) + 1;
                    cursor.continue();
                };
                req.onerror = () => resolve({});
            });
        }

        async function renderFolderTree() {
            const tree = document.getElementById('folderTree');
            const [pathList, counts] = await Promise.all([getAllFolders(), getFolderCounts()]);

            // 构建树结构
            const root = { path: '/', name: galleryHandle?.name || '全部', children: [] };
            const nodeMap = { '/': root };

            for (const p of pathList) {
                if (p === '/') continue;
                const parts = p.split('/').filter(Boolean);
                const name = parts[parts.length - 1];
                const parentPath = parts.length > 1 ? '/' + parts.slice(0, -1).join('/') : '/';
                const node = { path: p, name, children: [] };
                nodeMap[p] = node;
                (nodeMap[parentPath] || root).children.push(node);
            }

            // 计算总计数（自身 + 所有子孙）
            function calcCount(node) {
                let total = counts[node.path] || 0;
                for (const c of node.children) total += calcCount(c);
                node.count = total;
                return total;
            }
            calcCount(root);

            // 递归渲染
            function renderNode(node) {
                const hasCh = node.children.length > 0;
                const collapsed = collapsedFolders.has(node.path);
                const active = currentFolder === node.path;
                const arrow = hasCh ? `<span class="arrow absolute left-2 top-1/2 -translate-y-1/2 cursor-pointer select-none text-xs leading-none opacity-70 hover:opacity-100">${collapsed ? '▶' : '▼'}</span>` : '';
                const item = `<div class="folder-tree-item px-2 py-1 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 flex justify-between ${active ? 'bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300' : hasCh ? 'text-indigo-600 dark:text-indigo-400' : ''}" style="padding-left:28px;position:relative" data-folder="${node.path}">${arrow}<span class="truncate min-w-0">${escapeHtml(node.name)}</span><span class="text-xs opacity-60 flex-shrink-0">${node.count}</span></div>`;
                const ch = hasCh && !collapsed ? node.children.map(renderNode).join('') : '';
                return item + ch;
            }

            const scrollPos = tree.scrollTop;
            tree.innerHTML = renderNode(root);
            tree.scrollTop = scrollPos;

            // 箭头点击：展开/收起
            tree.querySelectorAll('.arrow').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const path = el.closest('.folder-tree-item').dataset.folder;
                    if (collapsedFolders.has(path)) collapsedFolders.delete(path);
                    else collapsedFolders.add(path);
                    renderFolderTree();
                });
            });

            // 文件夹名称点击：切换到该文件夹
            tree.querySelectorAll('.folder-tree-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.arrow')) return;
                    currentFolder = el.dataset.folder;
                    currentPage = 0;
                    renderFolderTree();
                    renderFolder(currentFolder);
                });
            });
        }

        let isLoadingMore = false;

        function sortFiles(files, sortBy, sortDir) {
            const sorted = [...files];
            sorted.sort((a, b) => {
                let cmp;
                if (sortBy === 'name') cmp = a.name.localeCompare(b.name, undefined, { numeric: true });
                else if (sortBy === 'type') cmp = a.type.localeCompare(b.type) || a.name.localeCompare(b.name);
                else if (sortBy === 'mtime') cmp = (a.mtime || 0) - (b.mtime || 0);
                else cmp = 0;
                return sortDir === 'desc' ? -cmp : cmp;
            });
            return sorted;
        }

        async function renderFolder(folder, append = false) {
            const grid = document.getElementById('fileGrid');
            const pathEl = document.getElementById('folderPath');
            const countEl = document.getElementById('fileCount');
            const folderPath = folder === '' ? '/' : folder;

            if (!append) {
                const allFiles = await loadFilesByFolder(folderPath, 0, 999999);
                sortedCache = sortFiles(allFiles, currentSort, currentSortDir);
                galleryTotal = sortedCache.length;
                pathEl.textContent = folderPath || '/';
                countEl.textContent = `${galleryTotal} 个文件`;
                grid.innerHTML = '';
                currentPage = 0;
            }

            if (galleryTotal === 0) {
                if (!append) grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10 text-sm">空文件夹</div>';
                return;
            }

            const offset = currentPage * pageSize;
            const files = sortedCache.slice(offset, offset + pageSize);
            if (files.length === 0) {
                if (!append) grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10 text-sm">空文件夹</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            for (const f of files) {
                const div = document.createElement('div');
                div.className = 'gallery-item bg-white dark:bg-[#262932] rounded-lg border border-gray-200 dark:border-gray-600 overflow-hidden cursor-pointer hover:shadow-md transition';
                div.dataset.path = f.path;
                div.innerHTML = `<div class="gallery-thumb w-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-xs text-gray-400 overflow-hidden" data-path="${escapeAttr(f.path)}" style="min-height:100px">加载中...</div><div class="p-1.5"><p class="text-xs text-gray-600 dark:text-gray-300 truncate">${escapeHtml(f.name)}</p></div>`;
                div.addEventListener('click', () => openImageViewer(f.path));
                fragment.appendChild(div);
            }
            grid.appendChild(fragment);

            // 生成缩略图（全部生成后再布局瀑布流）
            const thumbEls = grid.querySelectorAll('.gallery-thumb');
            await Promise.all(Array.from(thumbEls).map(el => generateThumbnail(el, el.dataset.path)));
            layoutMasonry();

            // 自动加载更多
            const nextOffset = (currentPage + 1) * pageSize;
            if (nextOffset < galleryTotal) {
                const sentinel = document.createElement('div');
                sentinel.style.height = '1px';
                grid.appendChild(sentinel);
                const obs = new IntersectionObserver(async (entries) => {
                    if (entries[0].isIntersecting && !isLoadingMore) {
                        isLoadingMore = true;
                        currentPage++;
                        obs.disconnect();
                        await renderFolder(folder, true);
                        isLoadingMore = false;
                    }
                }, { rootMargin: '300px' });
                obs.observe(sentinel);
            }
        }

        function layoutMasonry() {
            const grid = document.getElementById('fileGrid');
            const items = Array.from(grid.children).filter(el => el.classList.contains('gallery-item'));
            if (items.length === 0) return;
            const gridW = grid.offsetWidth;
            const cols = gridW >= 1024 ? 5 : gridW >= 768 ? 4 : gridW >= 480 ? 3 : 2;
            const gap = 8;
            const colW = (gridW - gap * (cols - 1)) / cols;
            const heights = new Array(cols).fill(0);
            items.forEach(item => {
                const col = heights.indexOf(Math.min(...heights));
                item.style.width = colW + 'px';
                item.style.left = (col * (colW + gap)) + 'px';
                item.style.top = (heights[col]) + 'px';
                heights[col] += item.offsetHeight + gap;
            });
            grid.style.height = Math.max(...heights) + 'px';
        }

        async function loadViewerPaths() {
            try {
                const db = await openDB();
                const tx = db.transaction('gallery', 'readonly');
                const index = tx.objectStore('gallery').index('folder');
                const folder = currentFolder === '' ? '/' : currentFolder;
                return await new Promise((resolve) => {
                    const paths = [];
                    const req = index.openCursor(folder);
                    req.onsuccess = () => {
                        const c = req.result;
                        if (!c) return resolve(paths);
                        paths.push(c.value.path);
                        c.continue();
                    };
                    req.onerror = () => resolve([]);
                });
            } catch (e) {
                // fallback
                const db = await openDB();
                const all = await new Promise((r) => {
                    const req = db.transaction('gallery', 'readonly').objectStore('gallery').getAll();
                    req.onsuccess = () => r(req.result || []);
                    req.onerror = () => r([]);
                });
                return all.filter(f => (f.folder || '/') === folder).map(f => f.path);
            }
        }

        async function openImageViewer(path) {
            // 加载当前文件夹所有路径用于导航
            viewerPaths = await loadViewerPaths();
            viewerIndex = viewerPaths.indexOf(path);
            if (viewerIndex === -1) { viewerPaths = [path]; viewerIndex = 0; }

            const existing = document.getElementById('imageViewer');
            if (existing) existing.remove();
            const overlay = document.createElement('div');
            overlay.id = 'imageViewer';
            overlay.className = 'fixed inset-0 z-[99999] bg-black/80 flex items-center justify-center';
            overlay.innerHTML = `
                <button class="close-btn absolute top-4 right-4 text-white text-2xl leading-none w-10 h-10 flex items-center justify-center hover:bg-white/20 rounded-full z-10">&times;</button>
                <button class="prev-btn absolute left-4 top-1/2 -translate-y-1/2 text-white w-12 h-12 flex items-center justify-center hover:bg-white/20 rounded-full z-10 text-2xl ${viewerIndex <= 0 ? 'hidden' : ''}">&#8249;</button>
                <button class="next-btn absolute right-4 top-1/2 -translate-y-1/2 text-white w-12 h-12 flex items-center justify-center hover:bg-white/20 rounded-full z-10 text-2xl ${viewerIndex >= viewerPaths.length - 1 ? 'hidden' : ''}">&#8250;</button>
                <div class="absolute inset-0 flex items-center justify-center overflow-hidden" style="pointer-events:none"><div class="text-white/60 text-sm">加载中...</div></div>
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 text-white/50 text-sm z-10">${viewerIndex + 1} / ${viewerPaths.length}</div>`;
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
            overlay.querySelector('.close-btn').addEventListener('click', () => overlay.remove());
            overlay.querySelector('.prev-btn')?.addEventListener('click', () => navigateViewer(-1));
            overlay.querySelector('.next-btn')?.addEventListener('click', () => navigateViewer(1));
            document.body.appendChild(overlay);
            loadFullImage(viewerPaths[viewerIndex], overlay.querySelector('.absolute.inset-0 > div'));
            document.addEventListener('keydown', handleViewerKey);
        }

        function navigateViewer(dir) {
            const newIdx = viewerIndex + dir;
            if (newIdx < 0 || newIdx >= viewerPaths.length) return;
            viewerIndex = newIdx;
            const overlay = document.getElementById('imageViewer');
            if (!overlay) return;
            const container = overlay.querySelector('.absolute.inset-0 > div');
            container.innerHTML = '<div class="text-white/60 text-sm">加载中...</div>';
            overlay.querySelector('.prev-btn').classList.toggle('hidden', viewerIndex <= 0);
            overlay.querySelector('.next-btn').classList.toggle('hidden', viewerIndex >= viewerPaths.length - 1);
            overlay.querySelector('.bottom-4').textContent = `${viewerIndex + 1} / ${viewerPaths.length}`;
            loadFullImage(viewerPaths[viewerIndex], container);
        }

        function handleViewerKey(e) {
            if (e.key === 'Escape') {
                const v = document.getElementById('imageViewer');
                if (v) v.remove();
                document.removeEventListener('keydown', handleViewerKey);
            } else if (e.key === 'ArrowLeft') {
                navigateViewer(-1);
            } else if (e.key === 'ArrowRight') {
                navigateViewer(1);
            }
        }

        async function loadFullImage(path, container) {
            try {
                const parts = path.split('/').filter(Boolean);
                let handle = galleryHandle;
                for (let i = 0; i < parts.length - 1; i++) handle = await handle.getDirectoryHandle(parts[i]);
                const fileHandle = await handle.getFileHandle(parts[parts.length - 1]);
                const file = await fileHandle.getFile();
                const url = URL.createObjectURL(file);
                const img = new Image();
                const wrapper = document.createElement('div');
                wrapper.style.cssText = 'position:absolute;inset:0;pointer-events:auto';
                img.onload = () => {
                    container.innerHTML = '';
                    img.width = img.naturalWidth;
                    img.height = img.naturalHeight;
                    wrapper.appendChild(img);
                    container.appendChild(wrapper);
                    URL.revokeObjectURL(url);
                    // 居中对齐
                    const maxW = window.innerWidth * 0.95;
                    const maxH = window.innerHeight * 0.9;
                    if (img.naturalWidth > maxW || img.naturalHeight > maxH) {
                        scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
                    }
                    originX = (window.innerWidth - img.naturalWidth * scale) / 2;
                    originY = (window.innerHeight - img.naturalHeight * scale) / 2;
                    applyTransform();
                };
                img.onerror = () => { container.textContent = '加载失败'; container.classList.add('text-red-400'); URL.revokeObjectURL(url); };
                img.className = 'rounded-lg shadow-2xl select-none';
                img.style.cssText = 'cursor:grab;transform-origin:0 0;max-width:none;max-height:none';
                img.draggable = false;

                let scale = 1, originX = 0, originY = 0, isPanning = false, startX, startY;

                function applyTransform() {
                    img.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
                }

                img.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    const newScale = Math.max(0.1, Math.min(20, scale * delta));
                    const rect = img.getBoundingClientRect();
                    const mx = (e.clientX - rect.left) / rect.width;
                    const my = (e.clientY - rect.top) / rect.height;
                    originX -= (mx - 0.5) * rect.width * (newScale - scale) / scale;
                    originY -= (my - 0.5) * rect.height * (newScale - scale) / scale;
                    scale = newScale;
                    applyTransform();
                });

                img.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    isPanning = true;
                    startX = e.clientX - originX;
                    startY = e.clientY - originY;
                    img.style.cursor = 'grabbing';
                });
                document.addEventListener('mousemove', (e) => {
                    if (!isPanning) return;
                    originX = e.clientX - startX;
                    originY = e.clientY - startY;
                    applyTransform();
                });
                document.addEventListener('mouseup', () => {
                    if (isPanning) { isPanning = false; img.style.cursor = 'grab'; }
                });

                // 双击重置缩放
                img.addEventListener('dblclick', () => {
                    scale = 1; originX = 0; originY = 0;
                    img.style.transform = '';
                    img.style.maxWidth = '';
                    img.style.maxHeight = '';
                });

                img.src = url;
            } catch (e) {
                container.textContent = '加载失败：' + e.message;
                container.classList.add('text-red-400');
            }
        }

        async function generateThumbnail(div, path) {
            try {
                const parts = path.split('/').filter(Boolean);
                let handle = galleryHandle;
                for (let i = 0; i < parts.length - 1; i++) {
                    handle = await handle.getDirectoryHandle(parts[i]);
                }
                const fileHandle = await handle.getFileHandle(parts[parts.length - 1]);
                const file = await fileHandle.getFile();
                const bitmap = await createImageBitmap(file, { resizeWidth: 600, resizeQuality: 'high' });
                const canvas = document.createElement('canvas');
                const maxDim = 600;
                let w = bitmap.width, h = bitmap.height;
                if (w > h) { if (w > maxDim) { h = h * maxDim / w; w = maxDim; } }
                else { if (h > maxDim) { w = w * maxDim / h; h = maxDim; } }
                canvas.width = Math.round(w);
                canvas.height = Math.round(h);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
                bitmap.close();
                div.innerHTML = `<img src="${canvas.toDataURL('image/jpeg', 0.92)}" class="w-full block" style="aspect-ratio:${canvas.width}/${canvas.height}">`;
            } catch (e) {
                div.textContent = '预览失败';
                div.classList.add('text-red-400');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
