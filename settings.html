<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>又记 - 设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <link rel="stylesheet" href="styles/theme.css">
    <script src="common.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="db.js"></script>
    <script src="notes-common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="min-h-screen">
    <div class="flex">
        <div id="sidebar-container"></div>

        <div class="flex-1 ml-16 p-8">
            <div class="max-w-2xl mx-auto">
                <h1 class="text-2xl font-bold text-gray-600 mb-8">设置</h1>

                <div class="space-y-6">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                        <h2 class="text-lg font-bold text-gray-700 mb-4">笔记文件夹</h2>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs text-gray-500 block mb-1">当前文件夹</label>
                                <div id="folderPathDisplay" class="text-sm text-gray-700 bg-gray-50 rounded-md px-3 py-2 border border-gray-200 min-h-[2.25rem]">未选择</div>
                            </div>
                            <button id="changeFolderBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-md text-sm hover:bg-indigo-700">更换文件夹</button>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                        <h2 class="text-lg font-bold text-gray-700 mb-4">显示设置</h2>
                        <div class="space-y-3">
                            <div class="flex items-center gap-2">
                                <label class="inline-flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                                    <input type="checkbox" id="showStatusFilterToggle" class="w-4 h-4">
                                    显示状态筛选栏
                                </label>
                                <span class="text-xs text-gray-400">在记录页顶部显示状态（想看/已看/在看）筛选按钮</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                        <h2 class="text-lg font-bold text-gray-700 mb-4">备份</h2>
                        <div class="space-y-4">
                            <button id="backupBtn" class="px-4 py-2 bg-green-600 text-white rounded-md text-sm hover:bg-green-700 inline-flex items-center gap-2">
                                <svg class="w-4 h-4" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 3v10m0 0-3-3m3 3 3-3"/><path d="M4 14v3h12v-3"/></svg>
                                一键备份笔记
                            </button>
                            <div class="flex items-center gap-2">
                                <label class="inline-flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                                    <input type="checkbox" id="backupReminderToggle" class="w-4 h-4">
                                    备份提醒
                                </label>
                                <span class="text-xs text-gray-400">超过 14 天未备份时在笔记页显示提示</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                        <h2 class="text-lg font-bold text-gray-700 mb-4">关于</h2>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center py-2 border-b border-gray-100">
                                <span class="text-sm text-gray-600">版本</span>
                                <span class="text-sm text-gray-700 font-medium">1.0.0</span>
                            </div>
                            <div class="flex justify-between items-center py-2 border-b border-gray-100">
                                <span class="text-sm text-gray-600">书影音记录</span>
                                <span id="recordCountDisplay" class="text-sm text-gray-700 font-medium">-</span>
                            </div>
                            <div class="flex justify-between items-center py-2 border-b border-gray-100">
                                <span class="text-sm text-gray-600">笔记总数</span>
                                <span id="noteCountDisplay" class="text-sm text-gray-700 font-medium">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = [];
        let folderHandle = null;

        async function init() {
            initPage('settings');
            records = await loadRecords();
            folderHandle = await getFolderHandle();
            updateFolderDisplay();
            updateStats();
            bindEvents();
            bindBackupReminderToggle();
            bindShowStatusFilterToggle();
        }

        function updateFolderDisplay() {
            const display = document.getElementById('folderPathDisplay');
            if (folderHandle) {
                display.textContent = folderHandle.name || '已选择文件夹';
            } else {
                display.textContent = '未选择';
            }
        }

        async function updateStats() {
            const recordCountEl = document.getElementById('recordCountDisplay');
            if (recordCountEl) recordCountEl.textContent = records.length;

            const noteCountEl = document.getElementById('noteCountDisplay');
            if (noteCountEl) {
                if (folderHandle) {
                    try {
                        const hasPermission = await verifyFolderPermission(folderHandle);
                        if (hasPermission) {
                            const noteFiles = await scanNotesFolder(folderHandle);
                            noteCountEl.textContent = noteFiles.length;
                            return;
                        }
                    } catch (e) {}
                }
                noteCountEl.textContent = '未连接';
            }
        }

        function bindEvents() {
            document.getElementById('changeFolderBtn').addEventListener('click', async () => {
                try {
                    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    const options = { mode: 'readwrite' };
                    const permission = await handle.requestPermission(options);
                    if (permission !== 'granted') {
                        alert('需要文件夹读写权限才能管理笔记');
                        return;
                    }
                    await saveFolderHandle(handle);
                    folderHandle = handle;
                    updateFolderDisplay();
                    updateStats();
                    alert('笔记文件夹已更换');
                } catch (e) {
                    if (e.name !== 'AbortError' && e.name !== 'SecurityError') {
                        alert('更换文件夹失败：' + e.message);
                    }
                }
            });

            document.getElementById('backupBtn').addEventListener('click', async () => {
                if (!folderHandle) { alert('请先选择笔记文件夹'); return; }
                if (typeof JSZip === 'undefined') { alert('JSZip 库未加载，请刷新后重试'); return; }
                const btn = document.getElementById('backupBtn');
                btn.textContent = '正在打包...';
                btn.disabled = true;
                try {
                    const zip = new JSZip();
                    const entries = [];
                    for await (const entry of folderHandle.values()) {
                        if (entry.kind === 'file' && entry.name.endsWith('.md')) {
                            entries.push(entry);
                        }
                    }
                    for (const entry of entries) {
                        const file = await entry.getFile();
                        const content = await file.text();
                        zip.file(entry.name, content);
                    }
                    const blob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `又记笔记备份_${new Date().toISOString().slice(0,10)}.zip`;
                    a.click();
                    URL.revokeObjectURL(url);
                    localStorage.setItem('lastBackupDate', new Date().toISOString());
                } catch (e) {
                    alert('备份失败：' + e.message);
                } finally {
                    btn.textContent = '一键备份笔记';
                    btn.disabled = false;
                }
            });
        }

        function bindBackupReminderToggle() {
            const toggle = document.getElementById('backupReminderToggle');
            const saved = localStorage.getItem('backupReminderDisabled');
            toggle.checked = saved !== 'true';
            toggle.addEventListener('change', () => {
                localStorage.setItem('backupReminderDisabled', toggle.checked ? 'false' : 'true');
            });
        }

        function bindShowStatusFilterToggle() {
            const toggle = document.getElementById('showStatusFilterToggle');
            const saved = localStorage.getItem('showStatusFilter');
            toggle.checked = saved !== 'false';
            toggle.addEventListener('change', () => {
                localStorage.setItem('showStatusFilter', toggle.checked ? 'true' : 'false');
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
