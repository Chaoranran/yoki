<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>又记 - 笔记</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <link rel="stylesheet" href="styles/theme.css">
    <style>
        .tag-pill {
            display: inline-block;
            background-color: rgba(159, 184, 196, 0.15);
            color: var(--c-accent);
            font-size: 0.65rem;
            padding: 0.05rem 0.4rem;
            border-radius: 9999px;
            margin-right: 0.15rem;
        }
        .dark .tag-pill {
            background-color: rgba(167, 192, 204, 0.2);
            color: var(--c-accent);
        }
        .tag-edit-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: rgba(159, 184, 196, 0.15);
            color: var(--c-accent);
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 9999px;
        }
        .dark .tag-edit-pill {
            background-color: rgba(167, 192, 204, 0.2);
        }
        .tag-edit-pill .tag-remove {
            cursor: pointer;
            opacity: 0.5;
            font-size: 0.7rem;
            line-height: 1;
        }
        .tag-edit-pill .tag-remove:hover {
            opacity: 1;
        }
        .editor-area {
            min-height: 400px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.7;
        }
        .wiki-link-text { color: var(--c-accent); text-decoration: underline; text-decoration-style: dashed; cursor: pointer; }
        .find-match { background-color: rgba(255, 200, 0, 0.3); border-bottom: 2px solid #f59e0b; }
        .find-match-active { background-color: rgba(255, 150, 0, 0.4); border-bottom: 3px solid #ef4444; }
        .ProseMirror mark { background-color: rgba(255,240,150,0.45); color: inherit; border-radius: 2px; }

        .ProseMirror { outline: none; min-height: 400px; padding: 1rem; font-size: 0.9375rem; line-height: 1.75; color: var(--c-text); }
        .ProseMirror > *:first-child { margin-top: 0; }
        .ProseMirror p { margin: 0.6em 0; }
        .ProseMirror h1 { font-size: 1.75em; font-weight: 700; margin: 1em 0 0.4em; padding-bottom: 0.3em; border-bottom: 1px solid var(--c-border); }
        .ProseMirror h2 { font-size: 1.4em; font-weight: 700; margin: 0.8em 0 0.3em; padding-bottom: 0.2em; border-bottom: 1px solid var(--c-border); }
        .ProseMirror h3 { font-size: 1.2em; font-weight: 600; margin: 0.7em 0 0.3em; }
        .ProseMirror ul { list-style-type: disc; padding-left: 1.5em; margin: 0.5em 0; }
        .ProseMirror ol { list-style-type: decimal; padding-left: 1.5em; margin: 0.5em 0; }
        .ProseMirror li { margin: 0.25em 0; }
        .ProseMirror li > p { margin: 0.2em 0; }
        .ProseMirror blockquote { border-left: 4px solid var(--c-accent); padding: 0.5em 1em; margin: 0.8em 0; background: var(--c-gray-100); border-radius: 0 4px 4px 0; color: var(--c-text-soft); }
        .ProseMirror code { background: var(--c-gray-100); padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.875em; font-family: 'Menlo', 'Consolas', monospace; }
        .ProseMirror pre { background: var(--c-gray-100); padding: 0.8em 1em; border-radius: 6px; overflow-x: auto; margin: 0.8em 0; }
        .ProseMirror pre code { background: none; padding: 0; font-size: 0.875em; }
        .ProseMirror a { color: var(--c-accent); text-decoration: underline; }
        .ProseMirror hr { border: none; border-top: 2px solid var(--c-border); margin: 1.5em 0; }
        .ProseMirror img { max-width: 100%; border-radius: 6px; }
        .ProseMirror strong { font-weight: 700; }
        .ProseMirror em { font-style: italic; }

        .fmt-btn {
            padding: 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--c-text-soft);
            cursor: pointer;
            line-height: 1;
            min-width: 32px;
            min-height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background-color 0.15s;
        }
        .fmt-btn:hover { background: var(--c-gray-100); color: var(--c-text); }
        .fmt-btn.active { color: var(--c-accent); }
        .fmt-sep { width: 1px; height: 16px; background: var(--c-border); margin: 0 4px; }

        #tocPanel {
            position: fixed;
            z-index: 100;
            background: var(--c-card, #fff);
            border: 1px solid var(--c-border, #e5e7eb);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            padding: 0.75rem 0;
            min-width: 200px;
            max-width: 320px;
            max-height: 60vh;
            overflow-y: auto;
        }
        #tocPanel .toc-item {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 0.35rem 1rem;
            font-size: 0.8125rem;
            color: var(--c-text-soft, #6b7280);
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #tocPanel .toc-item:hover { background: var(--c-gray-100, #f3f4f6); color: var(--c-text); }
        #tocPanel .toc-item[data-level="1"] { padding-left: 1rem; font-weight: 600; color: var(--c-text); }
        #tocPanel .toc-item[data-level="2"] { padding-left: 1.75rem; }
        #tocPanel .toc-item[data-level="3"] { padding-left: 2.5rem; font-size: 0.75rem; }
        #tocPanel .toc-empty { padding: 1rem; text-align: center; font-size: 0.75rem; color: var(--c-text-soft); }

        #sortCompactMenu {
            position: fixed;
            z-index: 100;
            background: var(--c-card, #fff);
            border: 1px solid var(--c-border, #e5e7eb);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            padding: 0.5rem 0;
            min-width: 140px;
        }
        #sortCompactMenu button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            color: var(--c-text-soft, #6b7280);
            cursor: pointer;
            transition: background-color 0.15s;
        }
        #sortCompactMenu button:hover { background: var(--c-gray-100, #f3f4f6); }
        #sortCompactMenu button.active { color: var(--c-accent); font-weight: 600; }
        #sortCompactMenu .sort-sep { border-top: 1px solid var(--c-border); margin: 0.25rem 0; }

        .note-list-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--c-border);
            cursor: pointer;
            transition: background-color 0.15s;
            position: relative;
        }
        .note-list-item:hover { background-color: var(--c-gray-100); }
        .note-list-item.active { background-color: rgba(159, 184, 196, 0.12); }
        .dark .note-list-item.active { background-color: rgba(167, 192, 204, 0.1); }
        .note-list-item.pinned { border-left: 3px solid var(--c-accent); }
        .note-list-item .item-delete {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.15s;
            padding: 4px;
            color: var(--c-text-soft);
        }
        .note-list-item:hover .item-delete { opacity: 1; }
        .note-list-item .item-delete:hover { color: #C88B8B; }

        @media (max-width: 767px) {
            #noteSidebar { display: none !important; }
            #noteSidebar.mobile-show { display: flex !important; width: 100% !important; min-width: 100% !important; }
            #noteDetailArea.mobile-show { display: block !important; }
            #noteDetailArea:not(.mobile-show) { display: none !important; }
            #noteEmptyState { display: none !important; }
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; padding: 0; height: auto; }
            #notesMainLayout { height: auto !important; overflow: visible !important; }
            #notesMainLayout > .flex { height: auto !important; }
            #noteDetailArea { position: static; left: 0; top: 0; width: 100%; overflow: visible !important; }
            #noteEditorArea { overflow: visible !important; }
            #milkdown-editor, #noteEditor { max-width: 100%; box-shadow: none; border: none; }
            .ProseMirror { min-height: auto; padding: 0; }
            #noteTitleInput { border: none; font-size: 1.5em; font-weight: 700; padding: 0; }
            #tagPillContainer { border: none; padding: 0; min-height: auto; }
            #noteEditorArea { padding: 0 !important; }
            #noteEditorArea .p-6 { padding: 0 !important; }
            #noteEditorArea .p-6 > .mx-auto { padding: 0 !important; max-width: 100% !important; }
            div.flex-1.ml-16 { margin-left: 0 !important; }
            @page { margin: 2cm; }
        }

        /* 当前行高亮 */
        .ProseMirror .active-line {
            background-color: rgba(159,184,196,0.06);
        }

        .float-btn {
            position: fixed;
            right: 1.5rem;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            background-color: var(--c-card);
            border: 1px solid var(--c-border);
            color: var(--c-text-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 40;
            transition: all 0.2s;
        }
        .float-btn:hover {
            background-color: var(--c-accent);
            color: #fff;
            border-color: var(--c-accent);
        }
        .float-btn-top { bottom: 6rem; }
        .float-btn-bottom { bottom: 2.5rem; }
        .float-btn svg {
            width: 14px;
            height: 14px;
            opacity: 0.7;
        }
        .float-btn:hover svg {
            opacity: 1;
            color: #fff;
        }
    </style>
    <script src="common.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/icons.js"></script>
    <script src="db.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="min-h-screen">
    <div class="flex">
        <div id="sidebar-container" class="no-print"></div>

        <div class="flex-1 ml-16">
            <div id="noFolderHint" class="text-center py-20">
                <p class="text-gray-400 text-lg mb-2">尚未选择笔记文件夹</p>
                <p class="text-gray-400 text-sm mb-4">点击「选择笔记文件夹」按钮，选择一个存放 .md 文件的目录</p>
                <button id="selectFolderBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-md text-sm hover:bg-indigo-700">
                    选择笔记文件夹
                </button>
                <p class="text-gray-400 text-xs mt-4">笔记以 .md 文件形式存储在本地文件夹中，脱离「又记」依然可用</p>
            </div>

            <div id="notesMainLayout" class="hidden" style="height: calc(100vh)">
                <div class="flex h-full">
                    <div id="noteSidebar" class="border-r border-gray-200 flex flex-col h-full overflow-hidden bg-white no-print" style="width: 280px; min-width: 180px; max-width: 500px;">
                        <div class="p-3 border-b border-gray-200">
                            <div class="flex items-center justify-between mb-2">
                                <h1 class="text-lg font-bold text-gray-700">笔记 <span id="noteCount" class="text-sm font-normal text-gray-400"></span></h1>
                                <div class="flex items-center gap-1">
                                    <button id="batchToggleBtn" class="px-2 py-1 text-xs bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">批量</button>
                                    <button id="newNoteBtn" class="px-3 py-1 bg-green-600 text-white rounded-md text-xs hover:bg-green-700 inline-flex items-center gap-1">
                                        <svg class="w-3.5 h-3.5" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="M7 1v12M1 7h12"/></svg>
                                        <span class="new-note-label">新建</span>
                                    </button>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 min-w-0">
                                <input type="text" id="searchBox" placeholder="搜索笔记..." class="border border-gray-300 rounded-md p-1.5 text-xs flex-1 min-w-0 outline-none">
                                <button id="tagToggleBtn" class="px-1.5 py-1 border border-gray-300 rounded-md text-xs text-gray-500 hover:text-gray-700 hover:bg-gray-100 flex-shrink-0" title="显示/隐藏标签">
                                    <svg class="w-3.5 h-3.5" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 3.5h7.5a2.5 2.5 0 0 1 0 5H4l-3 3v-8z"/><path d="M8.5 3.5H12a1.5 1.5 0 0 1 0 3H10"/></svg>
                                </button>
                                <select id="sortSelect" class="sidebar-sort-ui border border-gray-300 rounded-md p-1.5 text-xs flex-shrink-0 outline-none">
                                    <option value="modified">最近修改</option>
                                    <option value="created">创建时间</option>
                                    <option value="opened">最近打开</option>
                                    <option value="frequency">修改频率</option>
                                    <option value="title">标题</option>
                                </select>
                                <button id="sortOrderBtn" class="sidebar-sort-ui p-1.5 border border-gray-300 rounded-md text-xs text-gray-500 hover:text-gray-700 hover:bg-gray-100 flex-shrink-0" title="切换排序方向">
                                    <svg class="w-3.5 h-3.5" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3v8"/><path d="M4 6l3-3 3 3"/></svg>
                                </button>
                                <button id="sortCompactBtn" class="hidden px-1.5 py-1 border border-gray-300 rounded-md text-xs text-gray-500 hover:text-gray-700 hover:bg-gray-100 flex-shrink-0" title="排序">
                                    <svg class="w-3.5 h-3.5" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h10M2 7h7M2 10h4"/></svg>
                                </button>
                            </div>
                            <div id="batchToolbar" class="hidden mt-2 flex items-center gap-2">
                                <label class="inline-flex items-center gap-1 text-xs text-gray-600 cursor-pointer">
                                    <input type="checkbox" id="batchSelectAll" class="w-4 h-4">
                                    全选
                                </label>
                                <button id="batchDeleteBtn" class="px-3 py-1 bg-red-600 text-white rounded-md text-xs hover:bg-red-700">批量删除</button>
                                <button id="batchCancelBtn" class="px-3 py-1 bg-gray-200 text-gray-700 rounded-md text-xs hover:bg-gray-300">取消</button>
                                <span id="batchCount" class="text-xs text-gray-500"></span>
                            </div>
                        </div>
                        <div id="tagCloudSection" class="px-3 py-2 border-b border-gray-200 hidden">
                            <div class="flex flex-wrap items-center gap-1">
                                <span class="text-xs text-gray-500 font-medium">标签：</span>
                                <div id="noteTagCloud" class="flex flex-wrap gap-1"></div>
                            </div>
                        </div>
                        <div id="noteList" class="flex-1 overflow-y-auto"></div>
                        <div id="trashPanel" class="hidden flex-1 overflow-y-auto flex flex-col">
                            <div class="p-3 border-b border-gray-200 flex items-center justify-between">
                                <h2 class="text-sm font-bold text-gray-700">回收站</h2>
                                <button id="closeTrashBtn" class="text-xs text-gray-400 hover:text-gray-600">← 返回</button>
                            </div>
                            <div id="trashBatchBar" class="hidden px-3 py-2 border-b border-gray-200 flex items-center gap-2">
                                <label class="inline-flex items-center gap-1 text-xs text-gray-600 cursor-pointer">
                                    <input type="checkbox" id="trashSelectAll" class="w-4 h-4">
                                    全选
                                </label>
                                <button id="trashBatchRestoreBtn" class="px-3 py-1 bg-indigo-600 text-white rounded-md text-xs hover:bg-indigo-700">批量恢复</button>
                                <button id="trashBatchDeleteBtn" class="px-3 py-1 bg-red-600 text-white rounded-md text-xs hover:bg-red-700">批量永久删除</button>
                                <span id="trashBatchCount" class="text-xs text-gray-500"></span>
                            </div>
                            <div id="trashList" class="flex-1 overflow-y-auto"></div>
                            <div class="p-2 border-t border-gray-200">
                                <button id="clearTrashBtn" class="w-full text-xs text-red-400 hover:text-red-600 py-1">清空回收站</button>
                            </div>
                        </div>
                        <div class="p-2 border-t border-gray-200 flex flex-col gap-1">
                            <div class="flex items-center justify-between">
                                <button id="backupBtn" class="text-xs text-gray-400 hover:text-indigo-600 inline-flex items-center gap-1" title="一键备份所有笔记为 ZIP">
                                    <svg class="w-3.5 h-3.5" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M10 3v10m0 0-3-3m3 3 3-3"/><path d="M4 14v3h12v-3"/></svg>
                                    备份
                                </button>
                            </div>
                            <div id="backupReminder" class="text-xs text-gray-300 hidden">上次备份超过 14 天</div>
                            <div class="flex items-center justify-between">
                                <label class="inline-flex items-center gap-1 text-xs text-gray-500 cursor-pointer" title="隐藏已归档笔记（含 #归档 标签）">
                                    <input type="checkbox" id="hideArchivedToggle">
                                    隐藏已归档
                                </label>
                                <button id="trashBtn" class="text-xs text-gray-400 hover:text-indigo-600 inline-flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5h12M7 5V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m1 0v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5h7Z"/></svg>
                                    回收站
                                </button>
                            </div>
                        </div>
                    </div>
                    <div id="sidebarResizer" class="w-1 cursor-col-resize hover:bg-gray-400 active:bg-gray-500 flex-shrink-0 transition-colors no-print" title="拖拽调整宽度"></div>

                    <div id="noteDetailArea" class="flex-1 flex flex-col overflow-hidden">
                        <div id="noteEmptyState" class="flex items-center justify-center h-full text-gray-400">
                            <div class="text-center">
                                <p class="text-lg mb-1">选择一篇笔记</p>
                                <p class="text-sm">或点击「新建」创建新笔记</p>
                            </div>
                        </div>
                        <div id="noteEditorArea" class="hidden flex-1 overflow-y-auto">
                            <div id="formatBarContainer" class="sticky top-0 z-10 bg-white border-b border-gray-200 hidden no-print">
                                <div class="mx-auto px-6 sm:px-10 lg:px-16" style="max-width: min(100%, 56rem);">
                                    <div id="formatBar" class="flex items-center justify-between py-1.5">
                                        <div class="flex items-center gap-0.5">
                                            <button class="fmt-btn" data-action="undo" title="撤销 Ctrl+Z"><svg class="w-3.5 h-3.5" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7h10a4 4 0 0 1 0 8H7"/><path stroke-linecap="round" stroke-linejoin="round" d="m7 11-4 4 4 4"/></svg></button>
                                            <button class="fmt-btn" data-action="redo" title="重做 Ctrl+Y"><svg class="w-3.5 h-3.5" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17 7H7a4 4 0 0 0 0 8h6"/><path stroke-linecap="round" stroke-linejoin="round" d="m13 11 4-4-4-4"/></svg></button>
                                            <span class="fmt-sep"></span>
                                            <button class="fmt-btn" data-action="h1" title="一级标题">H1</button>
                                            <button class="fmt-btn" data-action="h2" title="二级标题">H2</button>
                                            <button class="fmt-btn" data-action="h3" title="三级标题">H3</button>
                                            <span class="fmt-sep"></span>
                                            <button class="fmt-btn" data-action="bold" title="加粗 Ctrl+B"><b>B</b></button>
                                            <button class="fmt-btn" data-action="italic" title="斜体 Ctrl+I"><i>I</i></button>
                                            <button class="fmt-btn" data-action="code" title="行内代码">&lt;/&gt;</button>
                                            <span class="fmt-sep"></span>
                                            <button class="fmt-btn" data-action="quote" title="引用">❝</button>
                                            <button class="fmt-btn" data-action="hr" title="分割线">——</button>
                                            <span class="fmt-sep"></span>
                                            <button class="fmt-btn" data-action="task" title="待办事项 ☐">
                                                <svg class="w-3.5 h-3.5" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/></svg>
                                            </button>
                                            <span class="fmt-sep"></span>
                                            <button class="fmt-btn" id="typographyBtn" title="排版设置">
                                                <svg class="w-3.5 h-3.5" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="10" y2="12"/></svg>
                                            </button>
                                            <span class="fmt-sep"></span>
                                            <div class="relative inline-flex">
                                                <button class="fmt-btn" id="highlightBtn" title="荧光笔高亮">
                                                    <svg class="w-3.5 h-3.5" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 11l1.5-1.5M7 7l1.5-1.5M11 3l1.5-1.5" /><path d="M11.5 2.5a1.5 1.5 0 0 1 2 2l-9 9L2 14l.5-2.5 9-9z"/></svg>
                                                </button>

    <script type="module">
        let folderHandle = null;
        let noteFiles = [];
        let currentNoteFile = null;
        let currentSortBy = localStorage.getItem('noteSortBy') || 'modified';
        let sortAscending = localStorage.getItem('noteSortOrder') === 'asc';
        let currentTagFilter = null;
        let searchKeyword = '';
        let dateFilter = '';

        let milkEditor = null;
        let useMilkdown = false;
        let currentMarkdown = '';
        let isMobile = window.innerWidth < 768;
        let batchMode = false;
        let trashBatchMode = false;
        let sidebarWidth = parseInt(localStorage.getItem('noteSidebarWidth')) || 280;
        let currentTags = [];
        let tagVisible = false;
        let findQuery = '';
        let findActiveIndex = 0;

        const milkdownModules = {};

        let _currentFileNameForCursor = null;

        function saveCursorPosition(name, pos) {
            if (name) localStorage.setItem('noteCursor_' + name, String(pos));
        }

        async function loadMilkdown() {
            try {
                const core = await import('https://esm.sh/@milkdown/core@7.17.2');
                const preset = await import('https://esm.sh/@milkdown/preset-commonmark@7.17.2');
                const clip = await import('https://esm.sh/@milkdown/plugin-clipboard@7.17.2');
                const cur = await import('https://esm.sh/@milkdown/plugin-cursor@7.17.2');
                const list = await import('https://esm.sh/@milkdown/plugin-listener@7.17.2');
                const utils = await import('https://esm.sh/@milkdown/utils@7.17.2');
                const hist = await import('https://esm.sh/@milkdown/plugin-history@7.17.2');

                milkdownModules.core = core;
                milkdownModules.preset = preset;
                milkdownModules.clipboard = clip;
                milkdownModules.cursor = cur;
                milkdownModules.listener = list;
                milkdownModules.utils = utils;
                milkdownModules.history = hist;

                const pmView = await import('https://esm.sh/prosemirror-view@1.31.0');
                milkdownModules.pmView = pmView;

                const pmState = await import('https://esm.sh/prosemirror-state@1.4.4');
                milkdownModules.pmState = pmState;

                return true;
            } catch (e) {
                console.warn('Milkdown 加载失败，回退到 textarea 模式', e);
                return false;
            }
        }

        async function initMilkdownEditor() {
            if (!milkdownModules.core) return false;
            try {
                const { Editor, rootCtx, defaultValueCtx, editorViewOptionsCtx, editorViewCtx } = milkdownModules.core;
                const { commonmark } = milkdownModules.preset;
                const { clipboard } = milkdownModules.clipboard;
                const { cursor } = milkdownModules.cursor;
                const { listener, listenerCtx } = milkdownModules.listener;
                const { history, undoCommand, redoCommand } = milkdownModules.history;

                milkEditor = await Editor.make()
                    .config((ctx) => {
                        ctx.set(rootCtx, document.getElementById('milkdown-editor'));
                        ctx.set(defaultValueCtx, '');
                        ctx.update(editorViewOptionsCtx, prev => ({
                            ...prev,
                            attributes: { class: 'milkdown-editor' },
                            decorations: (state) => {
                                const { Decoration, DecorationSet } = milkdownModules.pmView;
                                const decorations = [];
                                const { $from } = state.selection;
                                if ($from) {
                                    const start = $from.before(1);
                                    const end = $from.after(1);
                                    if (start !== undefined && end !== undefined && end > start) {
                                        decorations.push(Decoration.node(start, end, { class: 'active-line' }));
                                    }
                                }
                                const wikiRegex = /\[\[([^\]]+)\]\]/g;
                                const highlightRegex = /==([#$%@]?)(.+?)==/g;
                                state.doc.descendants((node, pos) => {
                                    if (node.isText) {
                                        wikiRegex.lastIndex = 0;
                                        let match;
                                        while ((match = wikiRegex.exec(node.text)) !== null) {
                                            const from = pos + match.index;
                                            const to = pos + match.index + match[0].length;
                                            decorations.push(Decoration.inline(from, to, {
                                                class: 'wiki-link-text',
                                                style: 'cursor: pointer;'
                                            }));
                                        }
                                        highlightRegex.lastIndex = 0;
                                        while ((match = highlightRegex.exec(node.text)) !== null) {
                                            const marker = match[1] || '';
                                            const content = match[2];
                                            const start = pos + match.index;
                                            const end = pos + match.index + match[0].length;
                                            const innerLen = match[1].length;
                                            const innerStart = start + 2 + innerLen;
                                            const innerEnd = end - 2;
                                            const bgColors = {
                                                '': 'rgba(255,240,150,0.45)',
                                                '#': 'rgba(180,200,240,0.45)',
                                                '$': 'rgba(180,230,180,0.45)',
                                                '%': 'rgba(255,200,210,0.45)',
                                                '@': 'rgba(210,190,240,0.45)',
                                            };
                                            const bgColor = bgColors[marker] || bgColors[''];
                                            const markerLen = 2 + innerLen;
                                            decorations.push(Decoration.inline(start, start + markerLen, {
                                                style: 'font-size: 0; opacity: 0; pointer-events: none;'
                                            }));
                                            if (innerEnd > innerStart) {
                                                decorations.push(Decoration.inline(innerStart, innerEnd, {
                                                    style: `background-color: ${bgColor}; border-radius: 2px;`
                                                }));
                                            }
                                            decorations.push(Decoration.inline(end - 2, end, {
                                                style: 'font-size: 0; opacity: 0; pointer-events: none;'
                                            }));
                                        }
                                        if (findQuery) {
                                            const lowerText = node.text.toLowerCase();
                                            const lowerQ = findQuery.toLowerCase();
                                            let idx = 0;
                                            while ((idx = lowerText.indexOf(lowerQ, idx)) !== -1) {
                                                const from = pos + idx;
                                                const to = pos + idx + findQuery.length;
                                                decorations.push(Decoration.inline(from, to, {
                                                    class: 'find-match'
                                                }));
                                                idx += findQuery.length;
                                            }
                                        }
                                    }
                                });
                                return DecorationSet.create(state.doc, decorations);
                            }
                        }));
                        ctx.get(listenerCtx).markdownUpdated((ctx, markdown) => {
                            currentMarkdown = markdown;
                            document.getElementById('saveStatus').textContent = '未保存';
                            clearTimeout(saveTimeout);
                            saveTimeout = setTimeout(saveCurrentNote, 800);
                            updateWordCount();
                            updateFormatState();
                            updateTocPanel();
                        });
                    })
                    .use(commonmark)
                    .use(clipboard)
                    .use(history)
                    .use(cursor)
                    .use(listener)
                    .create();

                milkEditor.action((ctx) => {
                    const view = ctx.get(editorViewCtx);
                    if (view && view.dom) {
                        view.dom.addEventListener('click', () => {
                            const { from } = view.state.selection;
                            if (from != null) saveCursorPosition(_currentFileNameForCursor, from);
                        });
                        view.dom.addEventListener('keyup', () => {
                            const { from } = view.state.selection;
                            if (from != null) saveCursorPosition(_currentFileNameForCursor, from);
                        });
                    }
                });

                return true;
            } catch (e) {
                console.warn('Milkdown 初始化失败，回退到 textarea', e);
                milkEditor = null;
                return false;
            }
        }

        function fallbackToTextarea() {
            document.getElementById('milkdown-editor').classList.add('hidden');
            document.getElementById('noteEditor').classList.remove('hidden');
            useMilkdown = false;
            milkEditor = null;
        }

        let tocPanelVisible = false;
        function toggleTocPanel() {
            if (tocPanelVisible) {
                closeTocPanel();
            } else {
                openTocPanel();
            }
        }
        function openTocPanel() {
            let panel = document.getElementById('tocPanel');
            if (!panel) {
                panel = document.createElement('div');
                panel.id = 'tocPanel';
                document.body.appendChild(panel);
            }
            const btn = document.getElementById('tocBtn');
            if (btn) {
                const rect = btn.getBoundingClientRect();
                panel.style.top = (rect.bottom + 6) + 'px';
                const panelWidth = 280;
                const left = Math.min(Math.max(8, rect.left), window.innerWidth - panelWidth - 8);
                panel.style.left = left + 'px';
            }
            tocPanelVisible = true;
            updateTocPanel();
            panel.classList.remove('hidden');
            setTimeout(() => {
                document.addEventListener('click', _tocOutsideClick);
                document.addEventListener('keydown', _tocEscClose);
            }, 0);
        }
        function closeTocPanel() {

        function updateTocPanel() {
            const panel = document.getElementById('tocPanel');
            if (!panel || !tocPanelVisible) return;
            const editorDom = document.querySelector('#milkdown-editor .ProseMirror') || document.getElementById('milkdown-editor');
            if (!editorDom) return;
            const headings = editorDom.querySelectorAll('h1, h2, h3');
            if (headings.length === 0) {
                panel.innerHTML = '<div class="toc-empty">暂无标题</div>';
                return;
            }
            panel.innerHTML = Array.from(headings).map((h, i) => {
                const level = parseInt(h.tagName[1]);
                const text = h.textContent.trim();
                if (!text) return '';
                return `<button class="toc-item" data-level="${level}" data-index="${i}">${escapeHtml(text)}</button>`;
            }).filter(Boolean).join('');
            panel.querySelectorAll('.toc-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    const headings = editorDom.querySelectorAll('h1, h2, h3');

                        closeTocPanel();
                    }

        function initTaskCheckbox() {
            const editorEl = document.getElementById('milkdown-editor');
            if (!editorEl) return;

            editorEl.addEventListener('click', (e) => {
                const target = e.target.closest('a');
                if (target && target.href) {
                    e.preventDefault();
                    window.open(target.href, '_blank');
                    return;
                }

                if (!milkEditor || !milkdownModules.core) return;
                const view = milkEditor.action(ctx => ctx.get(milkdownModules.core.editorViewCtx));
                if (!view) return;
                const pos = view.posAtCoords({ left: e.clientX, top: e.clientY });
                if (!pos) return;

                const $pos = view.state.doc.resolve(pos.pos);
                const parent = $pos.parent;
                if (!parent || !parent.isTextblock) return;

                const text = parent.textContent;
                const lineStart = $pos.pos - $pos.parentOffset;
                const regex = /\[( |x)\]/g;
                let match;
                while ((match = regex.exec(text)) !== null) {
                    const matchStart = match.index;
                    const matchEnd = matchStart + match[0].length;
                    const clickOffset = $pos.parentOffset;
                    if (clickOffset >= matchStart && clickOffset <= matchEnd) {
                        const from = lineStart + matchStart;
                        const to = lineStart + matchEnd;
                        const newText = match[0] === '[ ]' ? '[x]' : '[ ]';
                        const tr = view.state.tr.insertText(newText, from, to);
                        view.dispatch(tr);
                        return;
                    }
                }
            });
        }

        function triggerFindRedraw() {
            if (!milkEditor || !milkdownModules.core) return;
            const { editorViewCtx } = milkdownModules.core;
            milkEditor.action((ctx) => {
                const view = ctx.get(editorViewCtx);
                if (!view) return;
                view.dispatch(view.state.tr.setMeta('findUpdate', Date.now()));
            });

        function initFindBar() {
            const findInput = document.getElementById('findInput');
            const findPrevBtn = document.getElementById('findPrevBtn');
            const findNextBtn = document.getElementById('findNextBtn');
            const findCloseBtn = document.getElementById('findCloseBtn');
            const findCount = document.getElementById('findCount');
            const findBar = document.getElementById('findBar');
            const replaceInput = document.getElementById('replaceInput');
            const replaceBtn = document.getElementById('replaceBtn');
            const replaceAllBtn = document.getElementById('replaceAllBtn');
            const findMatchesPositions = [];

            function clearFindHighlights() {
                findQuery = '';
                findActiveIndex = 0;
                findMatchesPositions.length = 0;
                findCount.textContent = '0/0';
                if (useMilkdown && milkEditor) {
                    triggerFindRedraw();
                } else {
                    const textarea = document.getElementById('noteEditor');
                    if (textarea) {
                        textarea.setSelectionRange(0, 0);
                    }
                }
            }

            function doFind(query) {
                findQuery = query;
                findActiveIndex = 0;
                findMatchesPositions.length = 0;

                if (!query) {
                    findCount.textContent = '0/0';
                    if (useMilkdown && milkEditor) triggerFindRedraw();
                    return;
                }

                if (useMilkdown && milkEditor) {
                    const { TextSelection } = milkdownModules.pmState;
                    milkEditor.action((ctx) => {
                        const view = ctx.get(milkdownModules.core.editorViewCtx);
                        if (!view) { findCount.textContent = '0/0'; return; }
                        const lowerQ = query.toLowerCase();
                        view.state.doc.descendants((node, pos) => {
                            if (node.isText) {
                                const lowerText = node.text.toLowerCase();
                                let idx = 0;
                                while ((idx = lowerText.indexOf(lowerQ, idx)) !== -1) {
                                    findMatchesPositions.push({ from: pos + idx, to: pos + idx + query.length });
                                    idx += query.length;
                                }
                            }
                        });
                        const total = findMatchesPositions.length;
                        if (total > 0) {
                            findActiveIndex = 1;
                            const { from, to } = findMatchesPositions[0];
                            const resolvedFrom = view.state.doc.resolve(from);
                            const resolvedTo = view.state.doc.resolve(to);
                            const tr = view.state.tr.setSelection(new TextSelection(resolvedFrom, resolvedTo));
                            tr.scrollIntoView();
                            view.dispatch(tr);
                            findCount.textContent = `1/${total}`;
                        } else {
                            findCount.textContent = '0/0';
                        }
                    });
                } else {
                    const textarea = document.getElementById('noteEditor');
                    if (!textarea) { findCount.textContent = '0/0'; return; }
                    const text = textarea.value;
                    const lowerText = text.toLowerCase();
                    const lowerQ = query.toLowerCase();
                    let idx = 0;
                    while ((idx = lowerText.indexOf(lowerQ, idx)) !== -1) {
                        findMatchesPositions.push({ from: idx, to: idx + query.length });
                        idx += query.length;
                    }
                    const total = findMatchesPositions.length;
                    if (total > 0) {
                        findActiveIndex = 1;
                        textarea.focus();
                        textarea.setSelectionRange(findMatchesPositions[0].from, findMatchesPositions[0].to);
                        findCount.textContent = `1/${total}`;
                    } else {
                        findCount.textContent = '0/0';
                    }
                }
            }

            function scrollToActiveMatch() {
                if (findMatchesPositions.length === 0) return;
                if (findActiveIndex < 1 || findActiveIndex > findMatchesPositions.length) findActiveIndex = 1;
                if (useMilkdown && milkEditor) {
                    const { TextSelection } = milkdownModules.pmState;
                    milkEditor.action((ctx) => {
                        const view = ctx.get(milkdownModules.core.editorViewCtx);
                        if (!view) return;
                        const { from, to } = findMatchesPositions[findActiveIndex - 1];
                        const resolvedFrom = view.state.doc.resolve(from);
                        const resolvedTo = view.state.doc.resolve(to);
                        const tr = view.state.tr.setSelection(new TextSelection(resolvedFrom, resolvedTo));
                        tr.scrollIntoView();
                        view.dispatch(tr);
                        view.focus();
                    });
                } else {
                    const textarea = document.getElementById('noteEditor');
                    if (!textarea) return;
                    textarea.focus();
                    textarea.setSelectionRange(findMatchesPositions[findActiveIndex - 1].from, findMatchesPositions[findActiveIndex - 1].to);
                }
            }

            function updateFindMatchActiveClass() {
                const marks = document.querySelectorAll('.find-match');
                if (marks.length > 0) {
                    marks.forEach((m, i) => {
                        m.classList.toggle('find-match-active', i === findActiveIndex - 1);
                    });
                }
            }

            function goToNext() {
                if (findMatchesPositions.length === 0) return;
                if (findActiveIndex < 1 || findActiveIndex > findMatchesPositions.length) findActiveIndex = 1;
                findActiveIndex = (findActiveIndex % findMatchesPositions.length) + 1;
                updateFindMatchActiveClass();
                scrollToActiveMatch();
                findCount.textContent = `${findActiveIndex}/${findMatchesPositions.length}`;
            }

            function goToPrev() {
                if (findMatchesPositions.length === 0) return;
                if (findActiveIndex < 1 || findActiveIndex > findMatchesPositions.length) findActiveIndex = 1;
                findActiveIndex = findActiveIndex - 1;
                if (findActiveIndex < 1) findActiveIndex = findMatchesPositions.length;
                updateFindMatchActiveClass();
                scrollToActiveMatch();
                findCount.textContent = `${findActiveIndex}/${findMatchesPositions.length}`;
            }

            function replaceCurrent() {
                if (findMatchesPositions.length === 0 || findActiveIndex < 1) return;
                const replText = replaceInput.value;
                if (useMilkdown && milkEditor) {
                    milkEditor.action((ctx) => {
                        const view = ctx.get(milkdownModules.core.editorViewCtx);
                        if (!view) return;
                        const { from, to } = findMatchesPositions[findActiveIndex - 1];
                        view.dispatch(view.state.tr.insertText(replText, from, to));
                    });
                    setTimeout(() => doFind(findInput.value), 50);
                } else {
                    const textarea = document.getElementById('noteEditor');
                    if (!textarea) return;
                    const { from, to } = findMatchesPositions[findActiveIndex - 1];
                    textarea.value = textarea.value.substring(0, from) + replText + textarea.value.substring(to);
                    textarea.dispatchEvent(new Event('input'));
                    setTimeout(() => doFind(findInput.value), 50);
                }
            }

            function replaceAll() {
                if (findMatchesPositions.length === 0) return;
                const replText = replaceInput.value;
                if (useMilkdown && milkEditor) {
                    milkEditor.action((ctx) => {
                        const view = ctx.get(milkdownModules.core.editorViewCtx);
                        if (!view) return;
                        let tr = view.state.tr;
                        for (let i = findMatchesPositions.length - 1; i >= 0; i--) {
                            const { from, to } = findMatchesPositions[i];
                            tr = tr.insertText(replText, from, to);
                        }
                        view.dispatch(tr);
                    });
                    setTimeout(() => doFind(findInput.value), 50);
                } else {
                    const textarea = document.getElementById('noteEditor');
                    if (!textarea) return;
                    let text = textarea.value;
                    for (let i = findMatchesPositions.length - 1; i >= 0; i--) {
                        const { from, to } = findMatchesPositions[i];
                        text = text.substring(0, from) + replText + text.substring(to);
                    }
                    textarea.value = text;
                    textarea.dispatchEvent(new Event('input'));
                    setTimeout(() => doFind(findInput.value), 50);
                }
            }

            findInput.addEventListener('input', () => doFind(findInput.value));
            findInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (e.shiftKey) goToPrev();
                    else goToNext();
                }
                if (e.key === 'Escape') {
                    findBar.classList.add('hidden');
                    clearFindHighlights();
                }
            });
            findNextBtn.addEventListener('click', goToNext);
            findPrevBtn.addEventListener('click', goToPrev);
            findCloseBtn.addEventListener('click', () => {
                findBar.classList.add('hidden');
                clearFindHighlights();
            });
            replaceBtn.addEventListener('click', replaceCurrent);
            replaceAllBtn.addEventListener('click', replaceAll);
            replaceInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    replaceCurrent();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !findBar.classList.contains('hidden')) {
                    findBar.classList.add('hidden');
                    clearFindHighlights();
                }
            });
        }

        function initWikiLinks() {
            if (!milkEditor || !milkdownModules.core) return;
            const editorEl = document.getElementById('milkdown-editor');
            if (!editorEl) return;

            editorEl.addEventListener('click', (e) => {
                const target = e.target.closest('a');
                if (target && target.href) return;

                if (!milkEditor) return;
                const view = milkEditor.action(ctx => ctx.get(milkdownModules.core.editorViewCtx));
                if (!view) return;
                const pos = view.posAtCoords({ left: e.clientX, top: e.clientY });
                if (!pos) return;

                const $pos = view.state.doc.resolve(pos.pos);
                const parent = $pos.parent;
                if (!parent || !parent.isTextblock) return;

                const text = parent.textContent;
                const wikiRegex = /\[\[([^\]]+)\]\]/g;
                let match;
                while ((match = wikiRegex.exec(text)) !== null) {
                    const clickOffset = $pos.parentOffset;
                    if (clickOffset >= match.index && clickOffset <= match.index + match[0].length) {
                        const title = match[1];
                        const noteExists = noteFiles.some(nf => nf.displayName === title);
                        if (noteExists) {
                            const nf = noteFiles.find(n => n.displayName === title);
                            if (nf) openNote(nf.name);
                        } else {
                            window.location.href = `search.html?q=${encodeURIComponent(title)}`;
                        }
                        e.preventDefault();
                        return;
                    }
                }
            });
        }

        /* ── 备份 ── */
        async function handleBackup() {
            if (!folderHandle) { alert('请先选择笔记文件夹'); return; }
            if (typeof JSZip === 'undefined') { alert('JSZip 库未加载，请刷新后重试'); return; }
            const backupBtn = document.getElementById('backupBtn');
            backupBtn.textContent = '正在打包...';
            backupBtn.disabled = true;
            try {
                const zip = new JSZip();
                const entries = [];
                for await (const entry of folderHandle.values()) {
                    if (entry.kind === 'file' && entry.name.endsWith('.md')) {
                        entries.push(entry);
                    }
                }
                for (const entry of entries) {
                    const file = await entry.getFile();
                    const content = await file.text();
                    zip.file(entry.name, content);
                }
                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `又记笔记备份_${new Date().toISOString().slice(0,10)}.zip`;
                a.click();
                URL.revokeObjectURL(url);
                localStorage.setItem('lastBackupDate', new Date().toISOString());
                checkBackupReminder();
            } catch (e) {
                alert('备份失败：' + e.message);
            } finally {
                backupBtn.textContent = '备份';
                backupBtn.disabled = false;
            }
        }

        function checkBackupReminder() {
            const reminder = document.getElementById('backupReminder');
            if (!reminder) return;
            if (localStorage.getItem('backupReminderDisabled') === 'true') {
                reminder.classList.add('hidden');
                return;
            }
            const lastBackup = localStorage.getItem('lastBackupDate');
            if (!lastBackup) { reminder.classList.add('hidden'); return; }
            const daysAgo = Math.floor((Date.now() - new Date(lastBackup).getTime()) / (1000 * 60 * 60 * 24));
            if (daysAgo >= 14) {
                reminder.textContent = `上次备份已超过 ${daysAgo} 天`;
                reminder.classList.remove('hidden');
            } else {
                reminder.classList.add('hidden');
            }
        }

        async function init() {
            initPage('notes');

            const loaded = await loadMilkdown();
            if (loaded) {
                const inited = await initMilkdownEditor();
                if (inited) {
                    useMilkdown = true;
                    document.getElementById('milkdown-editor').classList.remove('hidden');
                    document.getElementById('noteEditor').classList.add('hidden');
                    setTimeout(initWikiLinks, 100);
                } else {
                    fallbackToTextarea();
                }
            } else {
                fallbackToTextarea();
            }

            folderHandle = await getFolderHandle();
            if (folderHandle) {
                const hasPermission = await verifyFolderPermission(folderHandle);

        function applyFormat(action) {
            if (!useMilkdown || !milkEditor || !milkdownModules.core) return;
            const { commandsCtx } = milkdownModules.core;
            const { wrapInHeadingCommand, turnIntoTextCommand, toggleStrongCommand, toggleEmphasisCommand, toggleInlineCodeCommand, wrapInBlockquoteCommand, insertHrCommand } = milkdownModules.preset;
            const { undoCommand, redoCommand } = milkdownModules.history;
            milkEditor.action((ctx) => {
                const commands = ctx.get(commandsCtx);
                switch (action) {
                    case 'undo':
                        commands.call(undoCommand.key);
                        break;
                    case 'redo':
                        commands.call(redoCommand.key);
                        break;
                    case 'bold':
                        commands.call(toggleStrongCommand.key);
                        break;
                    case 'italic':
                        commands.call(toggleEmphasisCommand.key);
                        break;
                    case 'code':
                        commands.call(toggleInlineCodeCommand.key);
                        break;
                    case 'quote':
                        commands.call(wrapInBlockquoteCommand.key);
                        break;
                    case 'h1':
                        commands.call(wrapInHeadingCommand.key, 1);
                        break;
                    case 'h2':
                        commands.call(wrapInHeadingCommand.key, 2);
                        break;
                    case 'h3':
                        commands.call(wrapInHeadingCommand.key, 3);
                        break;
                    case 'hr':
                        commands.call(insertHrCommand.key);
                        break;
                    case 'task':
                        if (milkEditor && milkdownModules.core) {
                            const { editorViewCtx } = milkdownModules.core;
                            milkEditor.action((ctx) => {
                                const view = ctx.get(editorViewCtx);
                                if (!view) return;
                                const { from } = view.state.selection;
                                const tr = view.state.tr.insertText('- [ ] ', from);
                                view.dispatch(tr);
                            });
                        }
                        break;
                }
            });
        }

            } else {

        function updateFormatState() {
            if (!useMilkdown || !milkEditor || !milkdownModules.core) return;
            try {
                milkEditor.action((ctx) => {
                    const editorView = ctx.get(milkdownModules.core.editorViewCtx);
                    if (!editorView) return;
                    const state = editorView.state;
                    const { from } = state.selection;
                    const $pos = state.doc.resolve(from);
                    const marks = $pos.marks();
                    const activeFormats = new Set();
                    marks.forEach(mark => {
                        if (mark.type.name === 'strong') activeFormats.add('bold');
                        if (mark.type.name === 'em') activeFormats.add('italic');
                        if (mark.type.name === 'code_inline') activeFormats.add('code');
                    });
                    for (let d = $pos.depth; d > 0; d--) {
                        const node = $pos.node(d);
                        if (node.type.name === 'heading') {
                            activeFormats.add('h' + node.attrs.level);
                        }
                        if (node.type.name === 'blockquote') {
                            activeFormats.add('quote');
                        }
                    }
                    document.querySelectorAll('#formatBar .fmt-btn').forEach(btn => {
                        const action = btn.dataset.action;
                        if (action && action !== 'undo' && action !== 'redo') {
                            btn.classList.toggle('active', activeFormats.has(action));
                        }
                    });
                });
            } catch (e) {}
        }

### Markdown 语法
- **加粗**：\`**文字**\` 或选中后按 \`Ctrl+B\`
- **斜体**：\`*文字*\` 或选中后按 \`Ctrl+I\`
- **标题**：\`# 一级标题\`、\`## 二级标题\`、\`### 三级标题\`
- **列表**：\`- 项目\` 或 \`1. 项目\`
- **引用**：\`> 引用文字\`
- **链接**：\`[文字](网址)\`
- **代码**：\`\` \`代码\` \`\`
- **分割线**：\`---\`
- **荧光笔高亮**：\`==文字==\`，或选中后点击工具栏荧光笔按钮选择颜色

### 笔记管理
- **标签**：标题下方标签栏输入后按回车
- **搜索**：左侧搜索框支持按标题和正文搜索，输入 \`#标签名\` 按标签筛选
- **排序**：支持按修改时间、创建时间、最近打开、修改频率、标题排序
- **置顶**：右键笔记列表中的笔记选择「置顶」
- **归档**：右键笔记 →「归档」，可在「隐藏已归档」开关中隐藏

### 链接笔记
输入 \`[[笔记标题]]\` 创建到其他笔记的链接，点击即可跳转。

### 数据安全
笔记以 \`.md\` 文件形式存储在本地文件夹中。点击「备份」一键打包为 .zip 下载。删除的笔记进入回收站，30天内可恢复。

        async function scanNotesFolder() {
            if (!folderHandle) return [];
            const files = [];
            try {
                for await (const entry of folderHandle.values()) {
                    if (entry.kind === 'file' && entry.name.endsWith('.md')) {
                        try {
                            const file = await entry.getFile();
                            const isPinned = entry.name.startsWith('!');
                            files.push({
                                name: entry.name,
                                handle: entry,
                                file: file,
                                pinned: isPinned,
                                displayName: isPinned ? entry.name.slice(1, -3) : entry.name.slice(0, -3),
                                lastModified: file.lastModified,
                                size: file.size,
                            });
                        } catch (e) {
                            console.warn(`读取文件 ${entry.name} 失败`, e);
                        }
                    }
                }
            } catch (e) {
                console.warn('扫描文件夹失败', e);
            }
            return files;
        }

        async function loadNoteContent(nf) {
            try {
                const content = await nf.file.text();
                nf.content = content;
                nf.tags = parseTags(content);
                nf.source = parseSource(content);
                nf.title = nf.displayName;
                const bodyText = stripMetaLines(content);
                nf.preview = bodyText.substring(0, 100);
                nf.bodyText = bodyText;
            } catch (e) {
                console.warn(`加载笔记内容失败: ${nf.name}`, e);
                nf.tags = [];
                nf.preview = '';
                nf.bodyText = '';
                nf.content = '';
            }
        }

        async function refreshNoteList() {
            noteFiles = await scanNotesFolder();
            // 先设置标题，快速渲染列表骨架
            for (const nf of noteFiles) {
                nf.title = nf.displayName;
                nf.tags = [];
                nf.preview = '';
                nf.content = '';
                nf.bodyText = '';
            }
            renderNoteList();
            // 分批加载内容，每批5篇
            const batchSize = 5;
            for (let i = 0; i < noteFiles.length; i += batchSize) {
                const batch = noteFiles.slice(i, i + batchSize);
                await Promise.all(batch.map(nf => loadNoteContent(nf)));
                renderNoteList();
            }
            renderTagCloud();
        }

        function parseTags(content) {
            const firstLine = content.split('\n')[0] || '';
            if (firstLine.startsWith('tags:')) {
                return firstLine.slice(5).split(/[,，]/).map(t => t.trim()).filter(t => t);
            }
            return [];
        }

        function parseSource(content) {
            const lines = content.split('\n');
            for (const line of lines) {
                if (line.startsWith('source:')) {
                    return line.slice(7).trim();
                }
                if (!line.startsWith('tags:') && line.trim() !== '') {
                    break;
                }
            }
            return '';
        }

        function stripMetaLines(content) {
            const lines = content.split('\n');
            let start = 0;
            while (start < lines.length) {
                const line = lines[start].trim();
                if (line.startsWith('tags:') || line.startsWith('source:') || line === '') {
                    start++;
                } else {
                    break;
                }
            }
            return lines.slice(start).join('\n');
        }

                : '<svg class="w-3.5 h-3.5" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 11V3"/><path d="M4 8l3 3 3-3"/></svg>';
        }

        function renderTagCloud() {
            const tagCount = {};
            noteFiles.forEach(nf => {
                nf.tags.forEach(tag => { tagCount[tag] = (tagCount[tag] || 0) + 1; });
            });
            const tags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]);
            const container = document.getElementById('noteTagCloud');
            const section = document.getElementById('tagCloudSection');
            if (tags.length === 0) {
                section.classList.add('hidden');
                tagVisible = false;
                return;
            }
            if (!tagVisible) return;
            section.classList.remove('hidden');
            const maxDisplay = 10;
            const showTags = tags.slice(0, maxDisplay);
            const hasMore = tags.length > maxDisplay;
            const allBtn = `<button class="tag-btn px-2 py-0.5 rounded-full text-xs transition ${currentTagFilter === null ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}" data-tag="">全部</button>`;
            const tagBtns = showTags.map(([tag, count]) =>
                `<button class="tag-btn px-2 py-0.5 rounded-full text-xs transition ${currentTagFilter === tag ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}" data-tag="${escapeAttr(tag)}">${escapeHtml(tag)} (${count})</button>`
            ).join('');
            const moreHint = hasMore ? `<span class="text-xs text-gray-400 ml-1">+${tags.length - maxDisplay} 个</span>` : '';
            container.innerHTML = allBtn + tagBtns + moreHint;
            container.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentTagFilter = btn.dataset.tag || null;
                    renderTagCloud();
                    renderNoteList();
                });
                btn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const tag = btn.dataset.tag;
                    if (!tag) return;
                    window.createContextMenu([
                        { label: '删除标签', danger: true, action: () => deleteTagFromNotes(tag) },
                        { label: '合并标签', action: () => mergeTagInNotes(tag) },
                    ], e);
                });
            });
        }

        async function deleteTagFromNotes(tag) {
            if (!confirm(`确定从所有笔记中删除标签「${tag}」吗？`)) return;
            for (const nf of noteFiles) {
                if (!nf.tags.includes(tag)) continue;
                try {
                    const handle = nf.handle;
                    const file = await handle.getFile();
                    const content = await file.text();
                    const lines = content.split('\n');
                    let newLines = [];
                    let foundTags = false;
                    for (const line of lines) {
                        if (line.startsWith('tags:')) {
                            foundTags = true;
                            const currentTags = line.slice(5).split(/[,，]/).map(t => t.trim()).filter(t => t && t !== tag);
                            if (currentTags.length > 0) {
                                newLines.push('tags: ' + currentTags.join(', '));
                            }
                        } else {
                            newLines.push(line);
                        }
                    }
                    if (!foundTags) continue;
                    const newContent = newLines.join('\n');
                    const writable = await handle.createWritable();
                    await writable.write(newContent);
                    await writable.close();
                } catch (e) {
                    console.warn(`从 ${nf.name} 删除标签失败`, e);
                }
            }
            await refreshNoteList();
        }

        async function mergeTagInNotes(oldTag) {
            const allTags = new Set();
            noteFiles.forEach(nf => nf.tags.forEach(t => { if (t !== oldTag) allTags.add(t); }));
            const sortedTags = Array.from(allTags).sort();
            const input = prompt(`将标签「${oldTag}」合并到：\n可用标签：${sortedTags.join(', ')}`);
            if (!input || !input.trim()) return;
            const newTag = input.trim();
            if (newTag === oldTag) return;
            for (const nf of noteFiles) {
                if (!nf.tags.includes(oldTag)) continue;
                try {
                    const handle = nf.handle;
                    const file = await handle.getFile();
                    const content = await file.text();
                    const lines = content.split('\n');
                    let newLines = [];
                    for (const line of lines) {
                        if (line.startsWith('tags:')) {
                            const currentTags = line.slice(5).split(/[,，]/).map(t => t.trim()).filter(t => t);
                            const updated = currentTags.filter(t => t !== oldTag);
                            if (!updated.includes(newTag)) updated.push(newTag);
                            newLines.push('tags: ' + updated.join(', '));
                        } else {
                            newLines.push(line);
                        }
                    }
                    const newContent = newLines.join('\n');
                    const writable = await handle.createWritable();
                    await writable.write(newContent);
                    await writable.close();
                } catch (e) {
                    console.warn(`合并标签失败`, e);
                }
            }
            await refreshNoteList();
        }

        function renderNoteListItem(nf) {
            const tagsHtml = nf.tags.slice(0, 3).map(t => `<span class="tag-pill" style="cursor:pointer" data-tag="${escapeAttr(t)}">${escapeHtml(t)}</span>`).join('');
            const isActive = currentNoteFile && currentNoteFile.name === nf.name;
            const preview = nf.preview ? escapeHtml(nf.preview.substring(0, 60)) : '';
            const dateStr = new Date(nf.lastModified).toLocaleDateString('zh-CN');
            const checkbox = batchMode ? `<input type="checkbox" class="batch-checkbox w-4 h-4 mr-2 flex-shrink-0" data-name="${escapeAttr(nf.name)}">` : '';
            return `
                <div class="note-list-item ${isActive ? 'active' : ''} ${nf.pinned ? 'pinned' : ''}" data-name="${escapeAttr(nf.name)}">
                    <div class="flex items-center justify-between mb-0.5">
                        <div class="flex items-center flex-1 min-w-0">
                            ${checkbox}
                            <h3 class="font-bold text-gray-700 text-sm truncate flex-1 mr-2">${escapeHtml(nf.title)}</h3>
                        </div>
                        <span class="text-xs text-gray-400 flex-shrink-0">${dateStr}</span>
                    </div>
                    ${preview ? `<p class="text-xs text-gray-500 mb-1 truncate ${batchMode ? 'ml-6' : ''}">${preview}</p>` : ''}
                    ${tagsHtml ? `<div class="flex flex-wrap gap-0.5 ${batchMode ? 'ml-6' : ''}">${tagsHtml}</div>` : ''}
                    ${!batchMode ? `<button class="item-delete" data-name="${escapeAttr(nf.name)}" title="删除笔记">${iconTrash('w-4 h-4')}</button>` : ''}
                </div>
            `;
        }

        function renderNoteList() {
            let filtered = [...noteFiles];

            const hideArchived = document.getElementById('hideArchivedToggle')?.checked;
            if (hideArchived) {
                filtered = filtered.filter(nf => !nf.tags.includes('归档'));
            }

            if (dateFilter) {
                filtered = filtered.filter(nf => {
                    const d = new Date(nf.lastModified);
                    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    return ds === dateFilter;
                });
            }
            if (currentTagFilter) {
                filtered = filtered.filter(nf => nf.tags.includes(currentTagFilter));
            }
            if (searchKeyword) {
                filtered = filtered.filter(nf =>
                    nf.title.toLowerCase().includes(searchKeyword) ||
                    nf.content.toLowerCase().includes(searchKeyword)
                );
            }

            filtered.sort((a, b) => {
                if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;

                let compareResult = 0;
                switch (currentSortBy) {
                    case 'modified':
                        compareResult = b.lastModified - a.lastModified;
                        break;
                    case 'created': {
                        const aCreated = getNoteCreatedTime(a.name);
                        const bCreated = getNoteCreatedTime(b.name);
                        compareResult = bCreated - aCreated;
                        break;
                    }
                    case 'opened': {
                        const aOpened = getNoteOpenTime(a.name);
                        const bOpened = getNoteOpenTime(b.name);
                        compareResult = bOpened - aOpened;
                        break;
                    }
                    case 'frequency': {
                        const aFreq = getNoteModifyCount(a.name);
                        const bFreq = getNoteModifyCount(b.name);
                        compareResult = bFreq - aFreq;
                        break;
                    }
                    case 'title':
                    default:
                        compareResult = a.title.localeCompare(b.title, 'zh');
                        break;
                }
                return sortAscending ? -compareResult : compareResult;
            });

            const container = document.getElementById('noteList');
            const countEl = document.getElementById('noteCount');
            if (countEl) {
                if (searchKeyword && filtered.length > 0) {
                    countEl.textContent = `(找到 ${filtered.length} 篇笔记)`;
                } else {
                    countEl.textContent = `(${filtered.length})`;
                }
            }
            if (filtered.length === 0) {
                if (searchKeyword) {
                    container.innerHTML = `<div class="text-center text-gray-400 py-10 text-sm"><p class="mb-1">没有找到匹配的笔记</p><p class="text-xs">试试其他关键词</p></div>`;
                } else {
                    container.innerHTML = `<div class="text-center text-gray-400 py-10 text-sm"><p class="mb-3">暂无笔记</p><button id="openFolderBtn" class="text-xs text-indigo-500 hover:text-indigo-700 underline">打开笔记文件夹</button></div>`;
                }
                document.getElementById('openFolderBtn')?.addEventListener('click', () => {
                    if (folderHandle) window.open(folderHandle.name, '_blank');
                });
                return;
            }

            container.innerHTML = filtered.map(nf => renderNoteListItem(nf)).join('');

            container.querySelectorAll('.note-list-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.item-delete')) return;
                    if (batchMode) {
                        const cb = item.querySelector('.batch-checkbox');
                        if (cb && e.target !== cb) cb.checked = !cb.checked;
                        updateBatchCount();
                        return;
                    }
                    openNote(item.dataset.name);
                });
                item.addEventListener('mousedown', (e) => {
                    if (e.button === 1 && item.dataset.name) {
                        e.preventDefault();
                        window.open('notes.html?open=' + encodeURIComponent(item.dataset.name), '_blank');
                    }
                });
            });

            container.querySelectorAll('.item-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteNoteByName(btn.dataset.name);
                });
            });

            container.querySelectorAll('.tag-pill').forEach(pill => {
                pill.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const tag = pill.dataset.tag;
                    if (tag) {
                        currentTagFilter = tag;
                        document.getElementById('tagCloudSection').classList.remove('hidden');
                        tagVisible = true;
                        renderTagCloud();
                        renderNoteList();
                    }
                });
            });

            container.querySelectorAll('.batch-checkbox').forEach(cb => {
                cb.addEventListener('change', () => {
                    updateBatchCount();
                    syncSelectAllState();
                });
            });

            const selectAllCb = document.getElementById('batchSelectAll');
            if (selectAllCb) {
                selectAllCb.checked = false;
                selectAllCb.onchange = () => {
                    const checked = selectAllCb.checked;
                    container.querySelectorAll('.batch-checkbox').forEach(cb => {
                        cb.checked = checked;
                    });
                    updateBatchCount();
                };
            }
        }

        /* ── 注册右键菜单（注册表模式，由 common.js 统一分发） ── */
        function registerNoteContextMenus() {

        async function deleteNoteByName(fileName) {
            const nf = noteFiles.find(n => n.name === fileName);
            if (!nf) return;
            if (!confirm(`确定删除「${nf.displayName}」吗？将移入回收站`)) return;
            try {
                await addToTrash({
                    id: nf.name,
                    name: nf.name,
                    displayName: nf.displayName,
                    content: nf.content || '',
                    tags: nf.tags || [],
                    pinned: nf.pinned,
                    lastModified: nf.lastModified,
