        async function batchDeleteNotes() {
            const checkboxes = document.querySelectorAll('.batch-checkbox:checked');
            if (checkboxes.length === 0) return alert('请先勾选要删除的笔记');
            if (!confirm(`确定删除选中的 ${checkboxes.length} 篇笔记吗？将移入回收站`)) return;
            for (const cb of checkboxes) {
                const nf = noteFiles.find(n => n.name === cb.dataset.name);
                if (nf) {
                    try {
                        await addToTrash({
                            id: nf.name,
                            name: nf.name,
                            displayName: nf.displayName,
                            content: nf.content || '',
                            tags: nf.tags || [],
                            pinned: nf.pinned,
                            lastModified: nf.lastModified,
                        });
                        await folderHandle.removeEntry(nf.name);
                        if (currentNoteFile && currentNoteFile.name === cb.dataset.name) {
                            currentNoteFile = null;
                        }
                    } catch (e) {
                        console.warn(`删除 ${cb.dataset.name} 失败`, e);
                    }
                }
            }
            if (!currentNoteFile) closeNoteDetail();
            exitBatchMode();
            await refreshNoteList();
            // 批量删除后如果当前筛选结果为空白，自动跳回全部
            if (noteFiles.length > 0 && (searchKeyword || currentTagFilter)) {
                const container = document.getElementById('noteList');
                if (!container.querySelector('.note-list-item')) {
                    searchKeyword = '';
                    currentTagFilter = null;
                    const searchInput = document.getElementById('noteSearchInput');
                    if (searchInput) searchInput.value = '';
                    renderNoteList();
                }
            }
        }

        async function openTrashPanel() {
            if (batchMode) exitBatchMode();
            document.getElementById('noteList').classList.add('hidden');
            document.getElementById('trashPanel').classList.remove('hidden');
            await renderTrashList();
        }

        function closeTrashPanel() {
            if (trashBatchMode) exitTrashBatchMode();
            document.getElementById('trashPanel').classList.add('hidden');
            document.getElementById('noteList').classList.remove('hidden');
        }

        async function renderTrashList() {
            const trashItems = await loadTrash();
            const container = document.getElementById('trashList');
            if (trashItems.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm">回收站为空</div>';
                return;
            }
            trashItems.sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
            container.innerHTML = trashItems.map(item => {
                const dateStr = new Date(item.deletedAt).toLocaleDateString('zh-CN');
                const cbHtml = trashBatchMode ? `<input type="checkbox" class="trash-batch-cb w-4 h-4 mt-1 flex-shrink-0" data-id="${escapeAttr(item.id)}">` : '';
                return `
                    <div class="note-list-item flex items-start gap-2" data-id="${escapeAttr(item.id)}">
                        ${cbHtml}
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-0.5">
                                <h3 class="font-bold text-gray-700 text-sm truncate flex-1 mr-2">${escapeHtml(item.displayName)}</h3>
                                <span class="text-xs text-gray-400 flex-shrink-0">${dateStr}</span>
                            </div>
                            <div class="flex items-center gap-2 mt-1">
                                <button class="trash-restore text-xs text-indigo-500 hover:text-indigo-700" data-id="${escapeAttr(item.id)}">恢复</button>
                                <button class="trash-perm-delete text-xs text-red-400 hover:text-red-600" data-id="${escapeAttr(item.id)}">永久删除</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('.trash-restore').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    restoreFromTrash(btn.dataset.id);
                });
            });
            container.querySelectorAll('.trash-perm-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('永久删除后无法恢复，确定要永久删除此笔记吗？')) {
                        permanentDelete(btn.dataset.id);
                    }
                });
            });
            container.querySelectorAll('.note-list-item[data-id]').forEach(item => {
                item.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const id = item.dataset.id;
                    window.createContextMenu([
                        { label: '恢复', action: () => restoreFromTrash(id) },
                        { label: '永久删除', danger: true, action: () => { if (confirm('永久删除后无法恢复，确定要永久删除此笔记吗？')) permanentDelete(id); } },
                    ], e);
                });
            });

            // 批量操作：全选/反选
            const selectAll = document.getElementById('trashSelectAll');
            if (selectAll) {
                selectAll.checked = false;
                selectAll.addEventListener('change', () => {
                    container.querySelectorAll('.trash-batch-cb').forEach(cb => cb.checked = selectAll.checked);
                    updateTrashBatchCount();
                });
            }
            container.querySelectorAll('.trash-batch-cb').forEach(cb => {
                cb.addEventListener('change', updateTrashBatchCount);
            });
            updateTrashBatchCount();
        }

        function updateTrashBatchCount() {
            const count = document.querySelectorAll('.trash-batch-cb:checked').length;
            const el = document.getElementById('trashBatchCount');
            if (el) el.textContent = count > 0 ? `已选 ${count}` : '';
        }

        async function batchRestoreTrash() {
            const ids = [];
            document.querySelectorAll('.trash-batch-cb:checked').forEach(cb => ids.push(cb.dataset.id));
            if (ids.length === 0) return alert('请先勾选要恢复的笔记');
            if (!confirm(`确定恢复选中的 ${ids.length} 篇笔记吗？`)) return;
            for (const id of ids) {
                await restoreFromTrash(id);
            }
        }

        async function batchDeleteTrash() {
            const ids = [];
            document.querySelectorAll('.trash-batch-cb:checked').forEach(cb => ids.push(cb.dataset.id));
            if (ids.length === 0) return alert('请先勾选要永久删除的笔记');
            if (!confirm(`确定永久删除选中的 ${ids.length} 篇笔记吗？此操作不可恢复！`)) return;
            if (!confirm('再次确认：这些笔记将被永久删除。')) return;
            for (const id of ids) {
                await permanentDelete(id);
            }
        }

        async function permanentDelete(id) {
            await removeFromTrash(id);
            await renderTrashList();
        }

        async function restoreFromTrash(id) {
            const item = await getTrashItem(id);
            if (!item || !folderHandle) return;
            try {
                const fileName = item.name;
                const handle = await folderHandle.getFileHandle(fileName, { create: true });
                const writable = await handle.createWritable();
                await writable.write(item.content || '');
                await writable.close();
                await removeFromTrash(id);
                await renderTrashList();
                await refreshNoteList();
            } catch (e) {
                alert('恢复失败：' + e.message);
            }
        }

        async function handleClearTrash() {
            const trashItems = await loadTrash();
            if (trashItems.length === 0) return;
            if (!confirm('确定要清空回收站吗？回收站中的所有笔记将被永久删除，此操作不可恢复！')) return;
            await clearTrash();
            await renderTrashList();
        }

        async function openNote(fileName) {
            const nf = noteFiles.find(n => n.name === fileName);
            if (!nf) return;

            recordNoteOpen(fileName);

            if (currentNoteFile && currentNoteFile.name !== fileName) {
                await saveCurrentNote();
            }

            currentNoteFile = nf;
            _currentFileNameForCursor = fileName;
            try {
                const handle = nf.handle;
                const file = await handle.getFile();
                const content = await file.text();

                const tagsLine = content.split('\n')[0] || '';
                if (tagsLine.startsWith('tags:')) {
                    document.getElementById('noteTagsInput').value = tagsLine.slice(5);
                } else {
                    document.getElementById('noteTagsInput').value = '';
                }
                const sourceVal = parseSource(content);
                document.getElementById('noteSourceInput').value = sourceVal;
                syncTagsFromInput();
                renderTagPills();

                const displayContent = stripMetaLines(content);
                document.getElementById('noteTitleInput').value = nf.displayName;
                setEditorContent(displayContent);

                if (useMilkdown && milkEditor && milkdownModules.core) {
                    const { editorViewCtx } = milkdownModules.core;
                    const { TextSelection } = milkdownModules.pmState;
                    setTimeout(() => {
                        milkEditor.action((ctx) => {
                            const view = ctx.get(editorViewCtx);
                            if (!view) return;
                            const saved = localStorage.getItem('noteCursor_' + fileName);
                            if (saved) {
                                try {
                                    const pos = parseInt(saved);
                                    if (!isNaN(pos) && pos >= 0 && pos <= view.state.doc.content.size) {
                                        const tr = view.state.tr.setSelection(TextSelection.create(view.state.doc, pos));
                                        view.dispatch(tr);
                                        view.focus();
                                    }
                                } catch(e) {}
                            }
                        });
                    }, 100);
                } else {
                    const textarea = document.getElementById('noteEditor');
                    if (textarea) {
                        const saved = localStorage.getItem('noteCursor_' + fileName);
                        if (saved) {
                            try {
                                textarea.selectionStart = textarea.selectionEnd = parseInt(saved);
                            } catch(e) {}
                        }
                        textarea.focus();
                    }
                }
                document.getElementById('noteMeta').textContent = `修改于 ${new Date(nf.lastModified).toLocaleString('zh-CN')}`;
                document.getElementById('saveStatus').textContent = '';
                document.getElementById('pinNoteBtn').innerHTML = nf.pinned ? iconPin('w-4 h-4') + ' 取消置顶' : iconPin('w-4 h-4') + ' 置顶';

                document.getElementById('noteEmptyState').classList.add('hidden');
                document.getElementById('noteEditorArea').classList.remove('hidden');
                showFormatBar();
                updateWordCount();
                updateFormatState();

                if (isMobile) {
                    document.getElementById('noteSidebar').classList.remove('mobile-show');
                    document.getElementById('noteDetailArea').classList.add('mobile-show');
                }

                renderNoteList();
            } catch (e) {
                alert('打开笔记失败：' + e.message);
                currentNoteFile = null;
            }
        }

        async function saveCurrentNote() {
            if (!currentNoteFile) return;
            try {
                ensureNoteCreatedTime(currentNoteFile.name);
                recordNoteModify(currentNoteFile.name);
                const title = document.getElementById('noteTitleInput').value.trim() || '未命名笔记';
                const tags = document.getElementById('noteTagsInput').value.trim();
                const source = document.getElementById('noteSourceInput').value.trim();
                const body = getEditorContent();
                const tagsLine = tags ? `tags: ${tags}\n` : '';
                const sourceLine = source ? `source: ${source}\n` : '';
                const fullContent = tagsLine + sourceLine + body;

                const handle = currentNoteFile.handle;
                const writable = await handle.createWritable();
                await writable.write(fullContent);
                await writable.close();

                const newFileName = (currentNoteFile.pinned ? '!' : '') + title + '.md';
                if (newFileName !== currentNoteFile.name) {
                    await renameFile(currentNoteFile.name, newFileName);
                }

                document.getElementById('saveStatus').textContent = '已保存 ✓';
                await refreshNoteList();
            } catch (e) {
                document.getElementById('saveStatus').textContent = '保存失败';
                console.error('保存笔记失败', e);
            }
        }

        async function renameFile(oldName, newName) {
            if (oldName === newName) return;
            try {
                const oldHandle = await folderHandle.getFileHandle(oldName);
                const oldFile = await oldHandle.getFile();
                const content = await oldFile.text();

                const newHandle = await folderHandle.getFileHandle(newName, { create: true });
                const writable = await newHandle.createWritable();
                await writable.write(content);
                await writable.close();

                await folderHandle.removeEntry(oldName);

                currentNoteFile.name = newName;
                currentNoteFile.handle = newHandle;
                currentNoteFile.displayName = newName.startsWith('!') ? newName.slice(1, -3) : newName.slice(0, -3);
                currentNoteFile.title = currentNoteFile.displayName;
            } catch (e) {
                console.error('重命名失败', e);
            }
        }

        async function createNewNote() {
            if (!folderHandle) return alert('请先选择笔记文件夹');
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            const fileName = `未命名笔记_${timestamp}.md`;
            try {
                const handle = await folderHandle.getFileHandle(fileName, { create: true });
                const writable = await handle.createWritable();
                await writable.write('');
                await writable.close();
                ensureNoteCreatedTime(fileName);
                await refreshNoteList();
                await openNote(fileName);
                document.getElementById('noteTitleInput').focus();
                document.getElementById('noteTitleInput').select();
            } catch (e) {
                alert('新建笔记失败：' + e.message);
            }
        }

        async function createNoteFromSource(sourceTitle, sourceType, tagParam) {
            if (!folderHandle) return;
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            const safeTitle = sourceTitle.replace(/[\\/:*?"<>|]/g, '_');
            const fileName = `${safeTitle}_${tagParam}_${timestamp}.md`;
            const sourceLine = sourceTitle && sourceType ? `source: ${sourceTitle}::${sourceType}` : '';
            const tagsLine = tagParam ? `tags: ${tagParam}` : '';
            const content = (tagsLine ? tagsLine + '\n' : '') + (sourceLine ? sourceLine + '\n' : '');
            try {
                const handle = await folderHandle.getFileHandle(fileName, { create: true });
                const writable = await handle.createWritable();
                await writable.write(content);
                await writable.close();
                ensureNoteCreatedTime(fileName);
                await refreshNoteList();
                await openNote(fileName);
                document.getElementById('noteTitleInput').value = sourceTitle || '未命名笔记';
                document.getElementById('noteSourceInput').value = sourceTitle && sourceType ? `${sourceTitle}::${sourceType}` : '';
                setEditorContent('');
                showFormatBar();
                if (useMilkdown) {
                    document.getElementById('milkdown-editor').focus();
                } else {
                    document.getElementById('noteEditor').focus();
                }
            } catch (e) {
                alert('新建笔记失败：' + e.message);
            }
        }

        async function deleteCurrentNote() {
            if (!currentNoteFile) return;
            if (!confirm(`确定删除「${currentNoteFile.displayName}」吗？将移入回收站`)) return;
            try {
                await addToTrash({
                    id: currentNoteFile.name,
                    name: currentNoteFile.name,
                    displayName: currentNoteFile.displayName,
                    content: getEditorContent(),
                    tags: currentTags.slice(),
                    pinned: currentNoteFile.pinned,
                    lastModified: currentNoteFile.lastModified,
                });
                await folderHandle.removeEntry(currentNoteFile.name);
                currentNoteFile = null;
                closeNoteDetail();
                await refreshNoteList();
            } catch (e) {
                alert('删除失败：' + e.message);
            }
        }

        async function togglePinCurrentNote() {
            if (!currentNoteFile) return;
            const isPinned = currentNoteFile.pinned;
            const currentName = currentNoteFile.name;
            const newName = isPinned
                ? currentName.startsWith('!') ? currentName.slice(1) : currentName
                : '!' + currentName;
            await renameFile(currentName, newName);
            currentNoteFile.pinned = !isPinned;
            document.getElementById('pinNoteBtn').innerHTML = currentNoteFile.pinned ? iconPin('w-4 h-4') + ' 取消置顶' : iconPin('w-4 h-4') + ' 置顶';
            await refreshNoteList();
        }

        function closeNoteDetail() {
            if (currentNoteFile) saveCurrentNote();
            closeTocPanel();
            document.getElementById('noteEditorArea').classList.add('hidden');
            document.getElementById('noteEmptyState').classList.remove('hidden');
            hideFormatBar();
            currentNoteFile = null;
            if (useMilkdown) {
                setEditorContent('');
            }

            if (isMobile) {
                document.getElementById('noteSidebar').classList.add('mobile-show');
                document.getElementById('noteDetailArea').classList.remove('mobile-show');
            }

            renderNoteList();
        }

        function exportCurrentNote() {
            if (!currentNoteFile) return;
            const tags = document.getElementById('noteTagsInput').value.trim();
            const body = getEditorContent();
            const tagsLine = tags ? `tags: ${tags}\n` : '';
            const content = tagsLine + body;
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentNoteFile.displayName}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        /* ── 右键菜单辅助函数 ── */
        async function togglePinByName(name, pin) {
            const nf = noteFiles.find(n => n.name === name);
            if (!nf) return;
            const currentName = nf.name;
            const newName = pin
                ? (currentName.startsWith('!') ? currentName : '!' + currentName)
                : (currentName.startsWith('!') ? currentName.slice(1) : currentName);
            await renameFile(currentName, newName);
            nf.pinned = pin;
            if (currentNoteFile && currentNoteFile.name === name) {
                currentNoteFile.pinned = pin;
                document.getElementById('pinNoteBtn').innerHTML = pin ? iconPin('w-4 h-4') + ' 取消置顶' : iconPin('w-4 h-4') + ' 置顶';
            }
            await refreshNoteList();
        }

        async function renameNoteByName(name) {
            const nf = noteFiles.find(n => n.name === name);
            if (!nf) return;
            const newTitle = prompt('请输入新标题：', nf.displayName);
            if (!newTitle || newTitle.trim() === '' || newTitle === nf.displayName) return;
            const isPinned = nf.pinned;
            const newFileName = (isPinned ? '!' : '') + newTitle.trim() + '.md';
            await renameFile(name, newFileName);
            if (currentNoteFile && currentNoteFile.name === name) {
                currentNoteFile.name = newFileName;
                currentNoteFile.displayName = newTitle.trim();
                document.getElementById('noteTitleInput').value = newTitle.trim();
            }
            await refreshNoteList();
        }

        async function toggleArchiveByName(name, isArchived) {
            const nf = noteFiles.find(n => n.name === name);
            if (!nf) return;
            try {
                const handle = nf.handle;
                const file = await handle.getFile();
                const content = await file.text();
                const lines = content.split('\n');
                let tagsLine = '';
                let restStart = 0;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('tags:')) { tagsLine = lines[i]; restStart = i + 1; break; }
                    if (!line.startsWith('source:') && line !== '') { restStart = i; break; }
                }
                let currentTags = tagsLine ? tagsLine.slice(5).split(/[,，]/).map(t => t.trim()).filter(t => t) : [];
                if (isArchived) {
                    currentTags = currentTags.filter(t => t !== '归档');
                } else {
                    if (!currentTags.includes('归档')) currentTags.push('归档');
                }
                const newTagsLine = currentTags.length > 0 ? `tags: ${currentTags.join(', ')}\n` : '';
                const restContent = lines.slice(restStart).join('\n');
                for (let i = 1; i < restStart; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith('source:') || line === '') continue;
                    break;
                }
                const prefixLines = lines.slice(0, restStart).filter(l => {
                    const t = l.trim();
                    return t.startsWith('source:') || t === '';
                });
                const prefix = prefixLines.join('\n');
                const newContent = (newTagsLine ? newTagsLine : '') + (prefix ? prefix + '\n' : '') + restContent;
                const writable = await handle.createWritable();
                await writable.write(newContent);
                await writable.close();
                await refreshNoteList();
            } catch (e) {
                alert('归档操作失败：' + e.message);
            }
        }

        function exportNoteByName(name) {
            const nf = noteFiles.find(n => n.name === name);
            if (!nf) return;
            const tags = nf.tags ? nf.tags.join(', ') : '';
            const content = nf.content || '';
            const tagsLine = tags ? `tags: ${tags}\n` : '';
            const fullContent = tagsLine + content;
            const blob = new Blob([fullContent], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${nf.displayName}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        init();
    </script>

    <div id="floatTopBtn" class="float-btn float-btn-top no-print" title="回到顶部">
        <svg viewBox="0 0 16 16" fill="currentColor"><polygon points="8,2 2,10 14,10" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
    <div id="floatBottomBtn" class="float-btn float-btn-bottom no-print" title="去到底部">
        <svg viewBox="0 0 16 16" fill="currentColor"><polygon points="8,14 2,6 14,6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>

    <script>
        document.getElementById('floatTopBtn').addEventListener('click', () => {
            const el = document.getElementById('noteEditorArea');
            if (el && el.style.display !== 'none') el.scrollTo({ top: 0, behavior: 'smooth' });
            else window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        document.getElementById('floatBottomBtn').addEventListener('click', () => {
            const el = document.getElementById('noteEditorArea');
            if (el && el.style.display !== 'none') el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
            else window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });
    </script>
